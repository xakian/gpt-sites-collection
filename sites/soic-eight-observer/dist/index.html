<body data-topic="soic"><div id="observer"></div><template id="topic-notes"><label class="sr-only" for="station-select">選擇工作站</label><select id="station-select" aria-label="選擇工作站"></select><h2 id="panel-title"></h2><p class="in-out" id="in-out"></p><div id="detail-art" class="detail-art"></div><p id="detail-description"></p><ul id="detail-points"></ul><button id="seek-step" class="primary">定位此步 <span aria-hidden="true">↗</span></button><p class="pause-note">定位後保持暫停，可按上方播放接續。</p><details><summary>簡化與省略</summary><p id="detail-simplification"></p><p>這是所選 SOIC 的簡化代表流程。尺寸、晶粒數量與時間已縮放；跨站路徑表示工序移交，不代表實際廠房配置。部分固化、清洗、檢查與標記步驟已合併或省略。循環表示新一輪示範，成品不會還原成晶圓。</p><p>每站三秒是觀看安排，不能推論工廠產能或瓶頸。</p></details><details><summary>六步文字版</summary><ol id="text-steps"></ol></details><details><summary>材料與設定</summary><p>淡藍：矽晶粒　銀灰：NiPdAu 預鍍銅合金導線架　赭金：金線　米色：環氧固晶膠　深灰：環氧模封材料。</p><label class="check"><input id="show-labels" type="checkbox" checked> 顯示站名</label><p id="topic-motion-note">尊重系統「減少動態」偏好；可明確按播放或重播開始。</p><p>快捷鍵：Tab 切換控制；場景聚焦時空白鍵播放／暫停；Esc 關閉說明。</p></details><details><summary>製程來源</summary><p>依提供的開發規格書 v1.0 選定材料與流程，以下為規格書所列官方參考：</p><ul><li><a href="https://amkor.com/packaging/leadframe/soic-2/" target="_blank" rel="noopener">Amkor · SOIC</a></li><li><a href="https://carsem.com/services/assembly/i-c/" target="_blank" rel="noopener">Carsem · SOIC 材料</a></li><li><a href="https://www.ti.com/about-ti/worldwide-manufacturing/assembly-test.html" target="_blank" rel="noopener">TI · Assembly and test</a></li><li><a href="https://www.ti.com/lit/an/snoa286/snoa286.pdf" target="_blank" rel="noopener">TI · 封裝組裝基礎教材</a></li><li><a href="https://www.disco.co.jp/eg/solution/library/dicing/basic.html" target="_blank" rel="noopener">DISCO · 刀片切割原理</a></li></ul></details></template><script type="module" src="./app.js"></script></body></html>
