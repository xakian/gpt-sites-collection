<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>X 光 CT 焊點孔洞檢測</title><meta name="description" content="由同一試件的多角投影理解資料切片中的孔洞深度。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">固定儀器視角 · 36秒</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>投影、體積與切片</summary><p>主圖是同一試件的半透明定位圖。A與B在原0°方向前後排列，投影可以重疊。旋轉只改變觀察方向，孔洞不換位置。</p><p>右側投影採透射亮度，穿透較多較亮；預製切片採反相衰減灰階，金屬暗、空腔亮。A、B、C是原試件深度面，只有B穿過孔洞。資料切片不是X光刀。</p><p>本版未執行真正CT計算：畫面由同一組已知幾何產生，幾個投影只說明重建概念，不能宣稱足以反算。影像保存與待判讀標記也是動畫敘事，並非真實量測。</p></details><details><summary>簡化與來源</summary><p>採兩個不同深度的球形焊點與單一孔洞；平行束、尺寸、角度數、像素和時間都簡化。實際須更多角度及充分覆蓋，解析度、金屬偽影與散射都會影響判讀。本圖未模擬這些偽影，不把亮點全判壞，不提供通用合格孔洞率。</p><p>不建立重建引擎，不混入超音波或聲波時間窗。封裝電路、其他焊點與量產檢測流程省略。</p><ul><li><a href="https://inemi.org/iNEMI/News/Inspection-and-Reliability-Study-of-Voids-in-First-Level-Interconnects-for-Flip-Chip-Packages.aspx" target="_blank" rel="noreferrer">iNEMI：焊點孔洞的投影與CT檢測</a></li><li><a href="https://www.nikon.com/company/technology/technology_fields/optics/xray_source/" target="_blank" rel="noreferrer">Nikon：旋轉試件與序列影像重建</a></li></ul><p class="source-intro">2026-10-31查閱；共用規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
