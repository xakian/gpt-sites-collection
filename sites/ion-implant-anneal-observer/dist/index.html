<h2 id="note-title"></h2><h3>正在看什麼</h3><p id="note-body"></p><h3>值得注意的細節</h3><p id="note-detail"></p><button class="primary" id="seek-step">定位此步</button>
<details><summary>為什麼少量磷能改變導電特性？</summary><p>矽有四個價電子。取代晶格位置的磷有五個價電子，其中一個電子的束縛較弱；在室溫的適當條件下，可成為導帶中的可移動電子。電子多於電洞的區域稱為 n 型，並不表示整塊材料帶負電。</p><p>退火所說的「活化」，是讓摻雜原子能發揮電性作用；「施體游離」則是電子脫離束縛。兩者不是同一件事。動畫等到冷卻後才顯示電子，是為了把兩個概念分開。</p><p class="formula">σ = q(nμₙ + pμₚ)</p><p>導電率取決於載子數與遷移率。此處選擇近乎本徵矽中的適量磷摻雜，示範電子增加；不宣稱任何劑量、任何基板都必然更導電。缺陷、溫度與原有摻雜也會影響結果。</p></details>
<details><summary>簡化、比例與重要限制</summary><ul>
<li>40 秒是觀看時間，並非實際製程時間。這不是製程配方，不指定能量、劑量、光阻厚度或退火溫度。</li>
<li>固定剖面追蹤同一塊矽。原子大幅放大，三顆磷代表少量摻雜，圖中的原子比例不等於濃度。實際矽是三維鑽石結構；平面格線只表達局部有序，不是實際鍵角與配位。</li>
<li>只示範磷的 n 型摻雜；不製作完整電晶體，不加入閘極、接點、p–n 接面或外加電場。未畫本徵電子與電洞，不表示未摻雜矽完全不導電。</li>
<li>光阻已事先圖案化。假設厚度足以阻擋所選離子。省略薄的表面氧化層、離子源、質量篩選、掃描束、傾角與通道效應；不呈現精確深度分布、側向散射或濺射。</li>
<li>入射 P⁺ 的電荷與矽內施體 P⁺ 的意義不同；前者用於加速，後者代表已提供電子。停止後的電荷交換未逐一呈現。</li>
<li>局部位移、空位與間隙原子只追蹤少量代表。未模擬高劑量非晶化、缺陷群聚與完整碰撞級聯。退火中畫出位移矽移到表面，代表缺陷匯；實際還有缺陷復合與其他遷移路徑。</li>
<li>選定的三顆磷都活化，只表示成功的代表事件；不是百分之百活化率的承諾。退火亦會使摻雜擴散，這裡僅顯示局部移位，未計算輪廓展寬、殘餘缺陷與溶解度限制。</li>
<li>熱色表示加熱，不是矽真的呈現此顏色。電子的緩慢路徑不是軌域、真實速度或電流量測；無外加電場，不賦予單向漂移。</li>
</ul></details>
