<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="追蹤同一塊晶圓局部剖面，觀察曝光、顯影、薄膜蝕刻與去膠的 32 秒繁體中文動畫。"><title>微影到蝕刻：圖案怎麼留下來</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head>
<body data-topic="lithography-etch"><div id="observer"></div><noscript>此動畫需要啟用 JavaScript。</noscript><template id="topic-notes">
<label for="step-select">選擇觀察步驟</label><select id="step-select" aria-label="選擇觀察步驟"></select><h2 id="note-title"></h2><p id="note-main"></p><ul id="note-points"></ul><button class="primary" id="seek-step">定位此步</button><p class="pause-note">定位後保持暫停，可按上方播放接續。</p>
<details><summary>剖面在看哪裡？</summary><svg class="section-guide" viewBox="0 0 320 160" role="img" aria-label="晶圓俯視中央剖線 A 到 A 對應主場景的局部剖面"><circle cx="74" cy="74" r="51" fill="#e5e9eb" stroke="#7b8c95"/><rect x="48" y="58" width="52" height="32" fill="#b7cfdc" stroke="#7b8c95"/><path d="M30 74H118" stroke="#536d80" stroke-dasharray="4 3"/><text x="20" y="65">A</text><text x="120" y="65">A′</text><path d="M146 74H174" stroke="#7b8c95"/><rect x="193" y="81" width="105" height="40" fill="#e5e9eb" stroke="#7b8c95"/><rect x="193" y="65" width="105" height="16" fill="#b7cfdc" stroke="#7b8c95"/><text x="196" y="48">局部剖面</text><text x="28" y="149">晶圓俯視</text></svg><p>主動畫持續看同一個局部。中央預定開口，左右保留薄膜。厚度與寬度放大示意，沒有呈現整片晶圓的真實尺度。</p></details>
<details><summary>三個值得暫停的畫面</summary><p><strong>曝光後：</strong>光阻性質已改變，表面仍然平整。</p><p><strong>顯影後：</strong>光阻有開口，下方薄膜仍完整。</p><p><strong>去膠後：</strong>光阻已移除，薄膜圖案仍在。</p></details>
<details><summary>本例的選擇與必要簡化</summary><ul><li>示範矽基板上的單層二氧化矽薄膜，採傳統正型光阻與透射式光罩。這是圖形轉移示意，不是量產配方。</li><li>薄膜起初已形成。塗佈、軟烤、沖洗及乾燥壓縮呈現。採非化學增幅型正型光阻概念，沒有呈現 EUV 或化學增幅光阻的曝光後烘烤。</li><li>光學簡化為縮小投影，省略完整鏡組、繞射與掃描。光罩不接觸光阻；細點紋代表性質改變，不代表真實材料顏色。</li><li>乾式蝕刻以方向性較強、側壁較直表示。光阻略有消耗；移除速率與停止在基板表面的結果是理想化示意，實際需控制選擇性、終點與過蝕刻。</li><li>流動及向外移動的短線交代溶解物或反應產物離開，不代表真實分子尺寸、路徑或反應速率。</li><li>32 秒是觀看安排。完成的是一層薄膜圖案，尚未呈現完整電晶體、互連或可用晶片。</li></ul></details>
