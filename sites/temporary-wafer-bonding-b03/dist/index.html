<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="追蹤同一片晶圓，觀察背磨、膠帶框架支撐、雷射解接合與殘膠清潔。"><title>暫時接合與薄晶圓搬運</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 01 · 36 秒</p><h2>支撐，先接上再放手</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改變動畫；定位後保持暫停。</p><details><summary>材料順序與支撐交接</summary><p>背磨時，由下往上依序是透明玻璃、紫色釋放層、黃色接合膠、晶圓正面與矽背面。綠色框架膠帶後來貼到背面，與接合膠不同。</p><p>本圖保持方向不變，以位於上方的框架承接薄片，便於追蹤；實際設備可連同支撐工具翻轉。環形框架在剖面呈現為兩側金屬邊。</p></details><details><summary>簡化與來源</summary><p>採 BrewerBOND 305 搭配 701 雷射釋放層的代表流程。701 使用透明載板；雷射作用於釋放層。清潔階段代表經個別相容性驗證的殘膠移除流程，不指定清潔藥液或保證任意膠帶皆相容。</p><p>矽與薄膜厚度不按比例；元件、磨屑與光束是符號。不計算應力、雷射熱傳或反應，不展開 TSV、SOI 或切割。</p><ul><li><a href="https://www.brewerscience.com/products/debonding-technologies/" target="_blank" rel="noreferrer">Brewer Science：雷射解接合材料組合</a></li><li><a href="https://www.brewerscience.com/products/brewerbond-materials/" target="_blank" rel="noreferrer">暫時接合與框架上清潔</a></li><li><a href="https://www.brewerscience.com/products/brewerbond-701/" target="_blank" rel="noreferrer">701 透明載板與釋放機制</a></li><li><a href="https://www.brewerscience.com/products/brewerbond-305/" target="_blank" rel="noreferrer">305 接合材料</a></li></ul><p class="source-intro">查閱：2026-10-31。共用規格 v1.0／範本 1.0.0／主題 1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
