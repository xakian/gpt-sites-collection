<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="中央聚合物TIM與周邊蓋膠分工，熱由晶粒經TIM和金屬蓋交給外部散熱"><title>散熱蓋與 TIM 組裝</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 7 · 28 秒</p><h2>中央傳熱，周邊固定</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>從已安裝晶粒的封裝開始。中央TIM1採矽膠導熱膏型代表，依Dow TC-5026的non-curing屬性；中央材料不做固化轉變。周邊膠採DOWSIL 3-6265類熱固化矽膠代表，固化的是周邊固定膠。兩種材料組合僅為教學模型，不宣稱已驗證的配方或組裝條件。</p><p>TIM填補晶粒頂面與蓋內表面間的微小空隙，降低接觸熱阻。短暫A放大圖將表面粗糙大幅放大；主圖的層厚亦不按比例。TIM沒有熔成焊料，顏色全程一致。</p><p>周邊蓋膠只在基板邊緣承接金屬蓋邊，與中央TIM分開。蓋下降後控制中央與周邊層厚，兩者不跨越晶粒側邊的保持淨空區。材料色用於辨識，並非商品實際顏色。</p><p>橙色箭頭代表定性熱傳路徑，熱由晶粒經TIM1進入金屬蓋，再穿過外部散熱邊界。邊界代表後續TIM2及散熱系統的總作用，不是蓋本身消滅熱量；本輪不裝散熱器、不求解溫度或流體。不同TIM配方的電性不一概而論。</p><ul><li><a href="https://www.dow.com/en-us/market/mkt-electronics/sub-elec-mems-sensors-actuators.html" target="_blank" rel="noreferrer">Dow：TIM1與lid attach位置及角色</a></li><li><a href="https://www.dow.com/en-us/market/mkt-electronics/sub-elec-data-center-cooling.html" target="_blank" rel="noreferrer">Dow：TC-5026為non-curing矽膠導熱材料</a></li><li><a href="https://www.dow.com/en-us/pdp.dowsil-3-6265-thixotropic-adhesive.02147483z.html" target="_blank" rel="noreferrer">Dow：3-6265周邊固定膠的熱固化屬性</a></li><li><a href="https://imapsource.org/article/57437-adhesion-and-cure-mechanism-studies-for-advanced-lidded-flip-chip-applications/attachment/122710.pdf" target="_blank" rel="noreferrer">Dow Corning原始研究：蓋膠與TIM1介面、固化與相容性</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
