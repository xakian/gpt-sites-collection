<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f0">
<meta name="description" content="點開企業與知識，探索台灣半導體產業的關係。"><title>台灣半導體產業知識座標圖</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="explore.css">
</head><body>
<main class="atlas" aria-label="台灣半導體產業知識座標圖">
<div id="graph-wrap" class="graph-wrap"><svg id="graph" role="group" aria-label="知識座標圖；點選單元探索，拖曳平移、滾輪縮放"></svg></div>
<button class="canvas-button search-toggle" data-action="filters" aria-label="搜尋與篩選" aria-expanded="false" aria-controls="sidebar" title="搜尋（Ctrl / ⌘ K）"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
<button id="clear-view" class="filter-reset" data-action="clear-filters" hidden>清除篩選 ×</button>
<aside class="sidebar floating-panel" id="sidebar" aria-label="搜尋與篩選" hidden>
<div class="panel-heading"><label class="search"><input id="search" type="search" placeholder="找一家公司或概念" aria-label="搜尋知識單元"></label><button class="close-button" data-action="filters" aria-label="關閉搜尋">×</button></div>
<details class="extra-filters"><summary>篩選</summary><div class="filter-fields"><label>知識類型<select id="type-filter"><option value="">全部類型</option></select></label><label>產業活動<select id="role-filter"><option value="">全部產業活動</option></select></label><label>企業相關知識<select id="company-filter"><option value="">全部企業及知識</option></select></label></div></details>
<div class="list-heading"><span id="list-label">知識索引</span><span id="list-count"></span><button data-action="clear-filters">清除</button></div><div id="node-list" class="node-list"></div></aside>
<details class="canvas-menu" id="more-menu"><summary class="canvas-button" aria-label="說明與工具" title="說明與工具">⋯</summary><div class="menu-panel floating-panel">
<button data-action="help">怎麼探索</button><button data-action="rubric">座標與評分說明</button><label><input type="checkbox" id="show-lines" checked> 顯示所選單元的連線</label><button data-action="swap">交換兩軸 ⇄</button>
<details class="advanced-tools"><summary>更多工具</summary><button data-action="compare">企業比較 <span id="compare-count">0</span></button><button data-action="data">資料與本機筆記</button><button data-action="pending">待評分 <span id="pending-count">0</span></button><div class="save-state" id="save-state"><i></i> 本機已保存</div></details></div></details>
<label class="canvas-axis axis-x"><select id="x-axis" aria-label="X 軸維度" title="切換橫軸維度"></select><span aria-hidden="true">→</span></label>
<label class="canvas-axis axis-y"><select id="y-axis" aria-label="Y 軸維度" title="切換縱軸維度"></select><span aria-hidden="true">→</span></label>
<div class="zoom-controls"><button data-action="zoom-out" aria-label="縮小" title="縮小">−</button><span id="zoom-level" aria-live="polite">100%</span><button data-action="zoom-in" aria-label="放大" title="放大">＋</button><button data-action="reset-view" aria-label="回到全圖" title="回到全圖">⤢</button></div>
<section id="cluster-panel" class="cluster-panel floating-panel" aria-label="同座標單元" hidden></section>
<aside id="detail" class="detail floating-panel" aria-label="知識詳情" tabindex="-1" hidden></aside>
</main><dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
