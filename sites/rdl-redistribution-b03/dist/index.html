<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="兩條封裝配線跨越晶粒邊界，種子層去除後才彼此隔離"><title>RDL 重佈線層</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 3 · 40 秒</p><h2>接點，延伸到晶粒以外</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>採單層銅半加成法：介電開窗、黏著／銅種子層、圖案化光阻、電鍍、去光阻、去外露種子及黏著層、保護介電層開接點。從準備好的重組面開始，省略各步搬運及清洗。</p><p>俯視顯示兩條線，A線剖面同步放大原焊墊的開窗接觸。種子層未蝕除前，兩線經連續薄金屬相連，不能稱為隔離。線下種子與黏著層保留；外露區按銅、黏著層先後移除，圖中合併表示。</p><p>電鍍電源負端接種子、正端接陽極。槽液與陽極以功能符號表示；不繪製漂浮粒子代替配線。薄層厚度放大、時間壓縮，不模擬電流分布、蝕刻側蝕或導通數值，不包含CMP、多層RDL或凸塊。</p><ul><li><a href="https://www.izm.fraunhofer.de/en/abteilungen/wafer-level-system-integration/leistungsangebot/hd_redistribution.html" target="_blank" rel="noreferrer">Fraunhofer IZM：重佈線、介電與電鍍種子</a></li><li><a href="https://blog.izm.fraunhofer.de/alternative-chemicals-for-processing/" target="_blank" rel="noreferrer">Fraunhofer IZM：去光阻與種子層化學</a></li><li><a href="https://imapsource.org/article/57449-enabling-a-robust-copper-seed-etch-process-for-fine-line-rdl-by-electroplating-on-a-thin-pvd-seed-layer" target="_blank" rel="noreferrer">IMAPS：細線RDL的種子層蝕刻</a></li><li><a href="https://www.atotech.com/wp-content/uploads/2019/03/2018-09-14_IMAPS2018_Upscaling-panel-size-for-Cu-plating-on-FOPLP-applications-to-reduce-manufacturing_rev.pdf" target="_blank" rel="noreferrer">Atotech：光阻開口內的銅電鍍</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
