<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="三顆晶粒以主動面朝下排片，壓縮模封後釋放共同加工面"><title>扇出重組晶圓</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 2 · 32 秒</p><h2>小晶粒，重新排成一大片</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>採 chip-first、face-down 的 eWLB 代表路線：黏著釋放膜覆於載板，晶粒朝下排放，再壓縮模封、固化，最後移除載板與膜。只展示共同加工表面，尚未製作 RDL。</p><p>主場景為固定剖切略帶厚度的側視，三顆代表晶粒保持尺寸、朝向、角標及間距。背部吸持與邊緣支撐是設備功能簡化；釋放方法依膜材，未指定材料配方或任意熱條件。</p><p>矽、模封材料及膜為不同材料；模封體絕緣，不是重新長出的矽。薄層放大、時間壓縮；省略翹曲、晶粒偏移及固化化學，實際需控制這些因素。</p><ul><li><a href="https://ase.aseglobal.com/fan-out-packaging/" target="_blank" rel="noreferrer">ASE：chip-first face-down fan-out</a></li><li><a href="https://imapsource.org/article/94701-characterizations-for-ewlb-embedded-wafer-level-ball-grid-array-antenna-in-molded-package-integrations-in-77ghz-automotive-applications.pdf" target="_blank" rel="noreferrer">JCET研究：貼膜、排片、壓縮模封、移除載板與膜</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
