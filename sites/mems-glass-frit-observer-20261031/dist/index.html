<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MEMS 空腔玻璃釉封裝</title><meta name="description" content="閉合玻璃釉環接合蓋片，保留微結構活動空間。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">固定剖面與俯視資訊圖 · 34 秒</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>如何看閉合釉環</summary><p>主圖切過蓋片兩側，紫色兩段是同一圈釉環的剖面；俯視小圖補出前後兩邊。小圖虛線只表示剖切位置，不是實體裂縫。</p><p>中央結構由錨點與細連接支撐，下方留空；凹槽形成上方空間。冷卻後微幅活動只是間隙示意。</p></details><details><summary>簡化與來源</summary><p>採預製器件與凹槽蓋片的傳統網版印刷釉膏路線：蓋片先印刷、乾燥排膠、預玻璃化，再加熱加壓接合。本例示意受控乾燥氮氣；沒有抽真空或洩漏測試，不宣稱氣密規格。</p><p>厚度、微幅位移、熱歷程與釉層潤濕非比例。釉膏配方、溫度壓力、外部電性引出、吸氣劑與後段測試省略；不重製微結構，也不採論文的噴印變體。</p><ul><li><a href="https://silicon-austria-labs.elsevierpure.com/ws/files/33111395/2022_Glass_frit_jetting.pdf" target="_blank" rel="noreferrer">Roshanghias 等（2022），第1–2頁傳統玻璃釉製程</a></li></ul><p class="source-intro">2026-10-31 查閱。共用規格 v1.0／範本 1.0.0／主題 1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
