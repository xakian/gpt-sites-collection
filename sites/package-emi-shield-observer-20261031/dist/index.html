<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>封裝表面 EMI 屏蔽</title><meta name="description" content="觀察頂面四側銅屏蔽與實際地層接觸，底部信號端子保持隔離。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">斜俯局部剖切 · 30秒</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>接地與信號怎麼分開</summary><p>綠灰地層在切單側面露出，與側面銅層接觸；再經左側地通孔連到底部接地端。兩個棕色信號通孔穿越地層時有避空，不與整片地層短接。</p><p>主圖剖切面為了觀察內部而移除前方表面，實際前後左右四側都有覆銅，資訊圖補出全周。底面端子由載具遮蔽，不形成一整片銅。最後測試板只示意接觸，電路省略。</p></details><details><summary>簡化與來源</summary><p>採公開來源的濺鍍銅方案，只畫已確認的銅屏蔽層，未添加未查證的其他金屬堆疊。膜厚、接點與避空均放大；不重講靶材濺鍍原理。表面準備與遮蔽為代表流程，設備配方未指定。</p><p>場線表現邊界作用、反射吸收與漏場，並非粒子，也不表示所有頻率完全阻隔。沒有套用來源測試件的dB數值；實際效果取決於頻率、材料、連接與開口設計。</p><ul><li><a href="https://imapsource.org/api/v1/articles/67636-an-innovative-package-emc-solution-using-a-highly-cost-effective-sputtered-conformal-shield.pdf" target="_blank" rel="noreferrer">Amkor / IMAPS 2016：第12–13頁露地層與銅膜接地流程</a></li></ul><p class="source-intro">2026-10-31查閱；共用規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
