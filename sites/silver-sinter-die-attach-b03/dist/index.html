<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="乾式置晶的壓力輔助銀燒結，主接合層與顆粒放大區同步"><title>銀燒結固晶</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 6 · 32 秒</p><h2>銀保持固態，顆粒逐步連成接合層</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>採InFORCE MF壓力輔助乾式置晶代表順序：模板印刷、預乾燥、加熱貼放，再壓力燒結。資料表第1頁流程圖確認置晶時基板與晶粒需加熱；本圖省略製程數值，不是可直接使用的溫壓配方。</p><p>以鍍銀銅墊及具有相容銀表面金屬化的功率晶粒為例。下方陶瓷提供電氣絕緣，導電虛線只走金屬層，不穿越陶瓷。基板全程有下承托，上壓頭經晶粒傳遞壓力。</p><p>濕膏含銀顆粒與有機載體。預乾燥去除大部分揮發成分，後續加熱移除剩餘有機物；淡褐色離開線索僅表示去向，不指定全部成分的化學反應。灰色銀顆粒從未畫成液滴。</p><p>A為同一接合層的概念放大圖，粒數與孔隙不按比例。接觸處成頸、頸部擴大，層厚縮小但保留孔隙；連結不是瞬間變成無孔實心銀板。熱與電路徑為定性示意，不代表量測效率。</p><ul><li><a href="https://www.indium.com/products/sintering-materials/pressure-sintering/inforce/" target="_blank" rel="noreferrer">Indium：InFORCE乾式置晶銀膏</a></li><li><a href="https://www.indium.com/wp-content/uploads/2025/03/InFORCE%C2%AEMF-Pressure-Assisted-Ag-Sinter-Paste-for-Die-Attach-PDS-100320-R1.pdf" target="_blank" rel="noreferrer">InFORCE MF產品資料表：流程圖與相容表面</a></li><li><a href="https://imapsource.org/article/67725-silver-sintering-paste-rendering-low-porosity-joint-for-high-power-die-attach-application.pdf" target="_blank" rel="noreferrer">Indium：低孔隙銀燒結接合的顆粒成頸說明</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
