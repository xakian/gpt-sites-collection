<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="兩片晶圓的SiO₂先預接合，退火後形成Cu對Cu電氣連接"><title>混合接合</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 4 · 34 秒</p><h2>同一界面，兩種材料接合</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>採 wafer-to-wafer Cu／SiO₂ 代表模型。從已完成元件、平坦化及清潔的晶圓開始；先表面準備與活化，翻面對準，室溫介電預接合，再退火強化介電接合並完成銅接點。</p><p>上片繞水平軸翻面，以剖面厚度的縮短與翻轉表示，不交換左右接點。金色角標與既有導線跟隨上片；兩對銅墊在對準後才靠近。銅表面受控凹陷極度放大，並非實際尺寸。</p><p>介電接合前緣用綠色界面線表示，此線不是新增膠層。退火期間銅保持固態；以凹陷逐步閉合表示定性接點形成，不計算熱膨脹、原子擴散或表面化學。電路路徑僅在接點完成後顯示。</p><p>不含焊球、熔融液滴或導電膠；不重作前段製程、SOI轉移。imec的Cu／SiCN研究只用於表面及凹陷原理，不挪用其間距、溫度或性能數字。</p><ul><li><a href="https://www.evgroup.com/technologies/fusion-and-hybrid-bonding/" target="_blank" rel="noreferrer">EV Group：介電預接合與退火金屬接合</a></li><li><a href="https://www.imec-int.com/en/articles/wafer-wafer-hybrid-bonding-pushing-boundaries-400nm-interconnect-pitch" target="_blank" rel="noreferrer">imec：平坦表面、銅凹陷、中心向外接合波</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
