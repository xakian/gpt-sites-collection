<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="追蹤兆聲波清洗中同一顆污染微粒，觀察脫附、輸送、沖洗與乾燥。"><title>兆聲波晶圓清洗｜微粒如何被帶走</title><link rel="stylesheet" href="shared/observer.css"></head><body><div id="observer"></div><template id="topic-notes"><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><div id="step-note"></div><button id="seek-step" class="primary">定位此步</button><details><summary>補充圖：整片晶圓與換能器</summary><svg viewBox="0 0 360 210" role="img" aria-label="旋轉晶圓、換能器與邊緣排液示意"><ellipse cx="180" cy="120" rx="125" ry="45" fill="#C9D5DC" stroke="#657985"/><path d="M65 95H190" stroke="#A499C1" stroke-width="12"/><path d="M200 133Q265 150 290 116M290 116l-3 17m3-17l-16 2" fill="none" stroke="#657985" stroke-width="2"/><path d="M290 133L335 154" stroke="#91B6C8" stroke-width="5"/><text x="55" y="67" font-size="17">換能器</text><text x="145" y="192" font-size="17">旋轉晶圓</text><text x="280" y="184" font-size="17">排液</text></svg><p>主畫面跟著晶圓的局部表面觀察，所以不讓剖面旋轉。聲能經液體傳遞，液流向邊緣收集。</p></details><details><summary>簡化與來源</summary><p>這是單片旋轉清洗的概念模型。液膜、顆粒及位移放大，28 秒不是真實工時。省略化學配方、三維流場與空化泡；不宣稱能去除全部污染或保證零損傷。聲學作用促進脫附，液流負責輸送。最後採超純水沖洗及旋轉／氮氣輔助乾燥。</p><p>以下來源支持原理，未複製插圖、配方或性能數字：</p><ul><li><a href="https://prosysmeg.com/technology-overview/" target="_blank" rel="noreferrer">ProSys — Technology Overview</a>：聲學作用與液流輸送。</li><li><a href="https://www.sps-polos.com/support/applications/spin-coater-drying/" target="_blank" rel="noreferrer">SPS POLOS — Spin Coater Drying</a>：單片沖洗與氮氣輔助旋乾。</li></ul><p class="source-intro">查閱 2026-10-31 · 主題 1.0.0 · 共用規格 v1.0 · 範本 1.0.0</p></details></template><script type="module" src="app.js"></script></body></html>
