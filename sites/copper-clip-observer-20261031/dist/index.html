<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>功率封裝銅夾接合</title><meta name="description" content="觀察預成形銅夾如何跨越晶粒側壁，焊接頂面與獨立端子。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">斜俯剖切示意 · 30 秒</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>完成態的接合關係</summary><p>底面金屬 → 底面焊料 → 承載墊與端子 A。</p><p>頂面可焊金屬 → 頂面焊料 → 預成形銅夾 → 落腳端焊料 → 端子 B。</p><p>綠色虛線追蹤頂面互連，藍色虛線追蹤底面互連；不是電流方向。跨越區不碰晶粒側壁或端子 A。畫面把模封體省略，讓接合界面持續可見；組件仍是待模封狀態。</p></details><details><summary>簡化與來源</summary><p>採雙端功率晶粒與單一銅夾的代表模型，並非精確複製某個商用料號。晶粒預先具有相容頂／底金屬化，焊料合金與溫度未指定；選用焊料接合，不展開銀燒結或線焊。</p><p>晶粒底面與銅夾兩端以同一代表性熱歷程示意；實際製程依材料、設備及元件設計決定。焊料層與工具間隙放大，厚度及時間非比例。支撐載具保留；模封、清洗與後段檢測省略。不宣稱散熱或導通電阻提升數字。</p><ul><li><a href="https://www.nexperia.com/products/diodes/family/CLIP-BONDED-FLATPOWER-CFP/" target="_blank" rel="noreferrer">Nexperia：實心銅夾 CFP 封裝</a></li><li><a href="https://www.indium.com/applications/power-electronics-packaging-and-assembly/clip-attach-lead-frame/" target="_blank" rel="noreferrer">Indium：預成形銅夾與焊料接合</a></li><li><a href="https://www.utacgroup.com/wp-content/uploads/2019/09/Copper-Clip-Package-for-high-performance-MOSFETs.pdf" target="_blank" rel="noreferrer">UTAC：銅夾與頂面金屬化、組裝次序</a></li></ul><p class="source-intro">2026-10-31 查閱；UTAC 可檢索摘要，全文目前無法由查詢工具取得。共用規格 v1.0／範本 1.0.0／主題 1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
