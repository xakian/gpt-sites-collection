let junctionClock=0,junctionRunning=!reduced,junctionBg=.20;
const junctionMarkers=Array.from({length:520},(_,i)=>({x:(i*.61803398875+.13)%1,y:(i*.41421356237+.07)%1,rank:(i*.73205080757+.29)%1}));
let maskClock=0,maskRunning=!reduced,maskWidth=40,maskPaths=null,maskOrigins=null;
const pages=[
{title:'整體分布',html:'<button class="concept" data-concept="dopants">摻雜原子</button>起初集中在<button class="concept" data-concept="silicon">矽</button>的<button class="concept" data-concept="surface">表面附近</button>。<br><button class="concept" data-concept="total">原子總數不變</button>，隨著<button class="concept" data-concept="spread">擴散</button>，分布逐漸向<button class="concept" data-concept="deep">深處</button>展開。',alt:'矽剖面中的黑點代表摻雜原子；它們從表面附近隨機移動，總數固定，分布逐漸向深處展開。'},
{title:'單一原子',html:'選出一個<button class="concept" data-concept="single">摻雜原子</button>，看它如何<button class="concept" data-concept="random">隨機移動</button>。<br>留下的<button class="concept" data-concept="trail">軌跡</button>，記錄<button class="concept" data-concept="steps">每一步的方向</button>。',alt:'同一批原子中選出一個放大標示，以細線顯示它的隨機移動軌跡；箭頭表示最近幾步的方向。'},
{title:'溫度與擴散',html:'<button class="concept" data-concept="initialBoth">相同的初始分布</button>，分別在<button class="concept" data-concept="lowTemp">較低溫</button>與<button class="concept" data-concept="highTemp">較高溫</button>下<button class="concept" data-concept="thermalDiffusion">擴散</button>。<br><button class="concept" data-concept="sameTime">相同時間</button>後，<button class="concept" data-concept="highTemp">較高溫</button>的一側通常分布得<button class="concept" data-concept="thermalDepth">更深</button>。',alt:'兩個相同大小的矽剖面並排：相同原子數、相同初始分布與相同經過時間。左側較低溫，右側較高溫；右側的原子隨機移動較頻繁，分布展開得更深。'},
{title:'時間與擴散',html:'在<button class="concept" data-concept="timeTemp">相同溫度</button>與<button class="concept" data-concept="timeInitial">相同初始分布</button>下，比較<button class="concept" data-concept="shortTime">較短時間</button>和<button class="concept" data-concept="longTime">較長時間</button>的<button class="concept" data-concept="timeDistribution">擴散</button>。<br><button class="concept" data-concept="longTime">時間更長</button>，<button class="concept" data-concept="timeDistribution">原子分布</button>通常會<button class="concept" data-concept="timeDepth">向深處展開</button>。',alt:'兩個相同大小、相同溫度的矽剖面並排，原子數與初始分布相同；左側觀察較短時間，右側觀察較長時間。兩邊的時鐘顯示各自累積的相對時間，右側分布通常更深。'},
{title:'濃度',html:'在<button class="concept" data-concept="equalVolume">相同體積</button>的<button class="concept" data-concept="sampleRegion">取樣區</button>裡，<button class="concept" data-concept="sampleAtoms">原子越多</button>，<button class="concept" data-concept="localConcentration">濃度越高</button>。<br>把<button class="concept" data-concept="sampleDepth">不同深度</button>的<button class="concept" data-concept="localConcentration">濃度</button>排在一起，就得到<button class="concept" data-concept="concentrationProfile">濃度分布</button>。',alt:'左側矽剖面分成十個等體積取樣層，可上下移動取樣框；框內原子被強調並顯示實際點數。右側各深度的橫條長度對應同一時刻、同一層的點數，以固定橫軸顯示相對濃度。'},
{title:'劑量與濃度的差別',html:'在<button class="concept" data-concept="doseArea">相同表面積</button>下，<button class="concept" data-concept="doseTotal">整柱原子總數相同</button>，代表<button class="concept" data-concept="equalDose">劑量相同</button>。<br>原子<button class="concept" data-concept="doseRedistribution">重新分布</button>後，<button class="concept" data-concept="doseVolume">相同體積</button>內的<button class="concept" data-concept="doseLocal">濃度</button>卻可以不同。',alt:'左側保留起初的原子分布，右側顯示同一批原子隨擴散重新分布。兩個矽柱的表面積同為 A，整柱各有 1,100 個原子，劑量相同；同深度等體積取樣框內的原子數可以不同。'},
{title:'濃度差與淨流動',html:'原子<button class="concept" data-concept="flowRandom">隨機移動</button>，<button class="concept" data-concept="flowRight">向右</button>或<button class="concept" data-concept="flowLeft">向左</button>穿越<button class="concept" data-concept="flowBoundary">分界線</button>。<br>有<button class="concept" data-concept="flowDifference">濃度差</button>時，平均<button class="concept" data-concept="flowNet">淨流動</button>由<button class="concept" data-concept="flowGradient">高濃度往低濃度</button>。',alt:'同一塊矽分成左右等體積區域，虛線只用來計數，不阻擋原子。原子無偏向地隨機移動；下方分別顯示向右、向左的累計穿越次數與兩者差值。可調整初始左右比例，包括濃度相同的情況。'},
{title:'為什麼要摻雜',html:'<button class="concept" data-concept="dopantAtoms">摻雜原子</button>能調整<button class="concept" data-concept="dopingLattice">矽晶格</button>中參與導電的<button class="concept" data-concept="chargeCarriers">載子</button>。<br><button class="concept" data-concept="nType">N 型</button>以<button class="concept" data-concept="mobileElectron">電子</button>為主，<button class="concept" data-concept="pType">P 型</button>以<button class="concept" data-concept="mobileHole">電洞</button>為主。',alt:'兩個局部矽晶格比較：N 型的磷原子提供可移動電子；P 型的硼原子對應可移動電洞。大圓標示 Si、P 或 B 原子，小實心點是電子，小空心圈是缺少電子的位置。P 型動畫顯示電子移入空位，電洞便換到另一處。此圖觀察已電離摻雜物與載子，原子位置固定。'},
{title:'預沉積：提供來源',html:'<button class="concept" data-concept="predepSource">外部來源</button>持續補充<button class="concept" data-concept="predepAtoms">摻雜原子</button>進入<button class="concept" data-concept="predepSilicon">矽內</button>。<br><button class="concept" data-concept="predepSurface">表面濃度</button>近似固定，<button class="concept" data-concept="predepTotal">矽內總量</button>隨時間增加。',alt:'上方充足的外部摻雜來源持續供應原子，點從表面進入下方的矽並隨機展開。下方左側顯示固定的表面濃度設定，右側顯示矽內實際示意點數逐漸增加；外部來源的點不計入矽內總數。此頁假設溫度固定與來源充足。'},
{title:'驅入：重新分布',html:'<button class="concept" data-concept="driveSource">移除來源</button>後繼續<button class="concept" data-concept="driveHeat">加熱</button>，<button class="concept" data-concept="driveTotal">矽內總量</button>不變。<br><button class="concept" data-concept="driveSurface">表層濃度</button>降低，分布<button class="concept" data-concept="driveDepth">向深處展開</button>。',alt:'接續第 09 單元預沉積結束時的同一批 1,100 個原子。上方外部來源已移除，不再加入新原子；加熱使原子繼續隨機移動。固定體積的表層取樣框顯示濃度相對於起點的變化，總量始終固定。強調向深處展開時，會顯示起初與目前的平均深度線。'},
{title:'遮罩與開口',html:'<button class="concept" data-concept="maskBlock">遮罩</button>阻擋直接供應，<button class="concept" data-concept="maskOpening">開口</button>露出<button class="concept" data-concept="maskSurface">矽表面</button>。<br><button class="concept" data-concept="maskAtoms">摻雜原子</button>從開口進入，再於矽內<button class="concept" data-concept="maskDiffusion">擴散</button>。',alt:'一塊矽上覆蓋灰色二氧化矽遮罩，中間留下開口。上方外部來源的原子只從開口進入，再在矽內隨機移動；遮罩內沒有穿透路徑。可調整開口寬度，重新觀察進入位置及原子分布。這是新增的一次局部預沉積示意，不承接第 10 單元的原子。'},
{title:'側向擴散',html:'<button class="concept" data-concept="lateralAtoms">原子</button>在矽內<button class="concept" data-concept="lateralDepth">向深處</button>，也<button class="concept" data-concept="lateralSide">向兩側</button>擴散。<br>越過<button class="concept" data-concept="lateralEdge">開口邊緣</button>，就能到達<button class="concept" data-concept="lateralUnder">遮罩下方</button>。',alt:'沿用第 11 單元的局部預沉積模型，從起點重新觀察。開口兩側的垂直虛線只是參考線，沒有障壁。較深色的點是位於遮罩下方的摻雜原子；它們都先由開口進入，再於矽內側向移動。滑過向兩側可顯示兩個代表原子的模擬軌跡，底部顯示此刻位於遮罩下方的點數。'},
{title:'接面與接面深度',html:'<button class="concept" data-concept="junctionDopants">兩種相反型摻雜</button>的<button class="concept" data-concept="junctionEqual">濃度相等處</button>，就是<button class="concept" data-concept="junctionPlane">接面</button>。<br>從<button class="concept" data-concept="junctionSurface">表面</button>到接面的距離，就是<button class="concept" data-concept="junctionDepth">接面深度</button>。',alt:'左側是矽剖面的濃度點示意，實心點表示新增的 N 型摻雜，空心圈表示原有均勻的 P 型背景摻雜。右側以同一深度尺度畫出兩者濃度；新增摻雜曲線與背景濃度線的交點，水平對應到左側的接面。標尺由矽表面量至接面，表示接面深度。可調整背景濃度比較交點位置；點是濃度示意，不是運動軌跡。'},
{title:'串成完整製程',html:'<button class="concept" data-concept="processMask">遮罩開口</button>後，以<button class="concept" data-concept="processSupply">預沉積</button>加入原子。<br><button class="concept" data-concept="processRemove">移除來源</button>再<button class="concept" data-concept="processDrive">驅入</button>，<button class="concept" data-concept="processTotal">同一批原子</button>繼續展開。',alt:'將局部擴散主流程接成四步：先在既有遮罩中形成開口；預沉積時，原子從開口持續加入矽；再移除外部供應與表面來源，保留矽內原子；最後驅入，讓完全相同的原子向深處及兩側移動，總量固定。底部四個步驟按鈕可跳至對應階段並暫停，進程拉桿可逐段回看。'},
{title:'曲線面積與劑量',html:'逐層加總<button class="concept" data-concept="areaConcentration">濃度</button> × <button class="concept" data-concept="areaThickness">層厚</button>，得到<button class="concept" data-concept="areaDose">劑量</button>。<br><button class="concept" data-concept="areaBatch">原子總量</button>不變，<button class="concept" data-concept="areaTotal">曲線面積</button>就不變。',alt:'左側為固定表面積的矽柱，右側以相同向下深度軸，畫出十個等厚層的平均濃度階梯圖。每層的寬度代表濃度，高度代表層厚，填色面積代表該層對劑量的貢獻。調整展開程度時，同一批 1,100 個原子重新分布，右側各層濃度隨之改變，但填色總面積及相對劑量始終為 1。可選取深度，同步對照該層的點數、濃度與面積。'},
{title:'濃度坡度與通量',html:'<button class="concept" data-concept="slopeDistance">同樣距離</button>下，<button class="concept" data-concept="slopeGradient">濃度差越大</button>，<button class="concept" data-concept="slopeNet">淨流動越大</button>。<br>整體由<button class="concept" data-concept="slopeDirection">濃往稀</button>，原子仍<button class="concept" data-concept="slopeExchange">雙向移動</button>。',alt:'左側用點的疏密呈現一個線性濃度分布，中央虛線為觀察面。兩個小箭頭及移動標記表示相反方向的平均交換，旁邊的大箭頭表示相減後的淨通量。右側沿相同深度畫出濃度曲線，以兩層中心的濃度差與固定距離標示坡度。調整上層減下層的濃度差，能比較上濃下稀、濃度相同及下濃上稀；淨箭頭隨坡度反向，濃度相同時兩向仍有交換，但平均淨通量為零。'},
{title:'一層的流入與流出',html:'對<button class="concept" data-concept="layerVolume">同一薄層</button>，比較<button class="concept" data-concept="layerIn">流入</button>與<button class="concept" data-concept="layerOut">流出</button>。<br><button class="concept" data-concept="layerBalance">兩者的差</button>，決定這層的<button class="concept" data-concept="layerChange">濃度變化</button>。',alt:'矽柱分為三個等厚層，選中間一層作為觀察對象；上邊界的向下箭頭表示淨流入，下邊界的向下箭頭表示淨流出。三層在封閉邊界內交換，整體總量固定。右側曲線記錄中層濃度隨相對時間的變化。底部可比較流入較多、進出相同或流出較多三種起始分布；中層會分別變濃、保持不變或變稀。進出相同時仍有持續通過中層的淨流動。'},
{title:'擴散尺度與平方根',html:'<button class="concept" data-concept="scaleD">同樣條件下</button>，<button class="concept" data-concept="scaleTime">時間 <span id="scaleTimeValue">1</span> 倍</button>，<button class="concept" data-concept="scaleLaw">距離 <span id="scaleLengthValue">1</span> 倍</button>。<br><button class="concept" data-concept="scaleLength">展開尺度</button>：量到<button class="concept" data-concept="scaleFraction">表面濃度約 37%</button>處。',alt:'兩張同刻度的濃度對深度曲線並排，左側固定在基準時間 1，右側時間可由 1 改到 9 倍。兩側分別標記濃度降至各自表面值約 37% 的位置，用從表面向下的尺標表示典型擴散距離。時間 4 倍時距離為 2 倍，時間 9 倍時距離為 3 倍。這是固定劑量、薄層起始、擴散係數相同的高斯模型；距離尺不是原子的最遠位置或接面深度。'},
{title:'熱預算：溫度與時間一起看',html:'溫度決定<button class="concept" data-concept="budgetRate">累積多快</button>，時間決定<button class="concept" data-concept="budgetTime">累積多久</button>。<br><button class="concept" data-concept="budgetInitial">同樣起點</button>下，<button class="concept" data-concept="budgetMatch">累積相同</button>，<button class="concept" data-concept="budgetSpread">展開也相同</button>。',alt:'兩欄比較同一材料及摻雜物的低溫長時保溫與高溫短時保溫。上圖以相同時間與擴散係數刻度畫出矩形：左側相對 D=1、時長 4，右側 D=4、時長可調。填色面積是已經過的 D 乘時間，虛線輪廓是整段設定。下方兩張同刻度濃度分布由同一有限寬度高斯起點展開；新增累積相同時分布相同。右段結束後保留其結束結果，不模擬後續冷卻。可調高溫時長，比較累積不足、恰好相同與累積較多的情況。'},
{title:'不同摻雜物，擴散速度不同',html:'<button class="concept" data-concept="speciesConditions">同溫同時</button>，<button class="concept" data-concept="speciesIdentity">摻雜物不同</button>，<button class="concept" data-concept="speciesSpread">展開也不同</button>。<br>本例加熱後，<button class="concept" data-concept="speciesB">硼 B</button>比<button class="concept" data-concept="speciesAs">砷 As</button>展開更深。',alt:'兩個獨立矽樣品，以相同起始分布、相同劑量、相同 1000°C 及相同加熱時間，比較硼 B 與砷 As。元素徽記和相對擴散係數短條分別識別兩種摻雜物；下方兩張圖採相同濃度及深度刻度，灰虛線保留共同起點，實線隨時間展開。此教學近似模型中硼的擴散係數較大，同一時間的分布展開較深。尺標量到各自表面濃度約 37% 處，不是接面或最深原子。'},
{title:'原子在晶格中怎麼移動',html:'原子<button class="concept" data-concept="latticeExchange">補進旁邊的</button><button class="concept" data-concept="latticeVacancy">空位</button>，<button class="concept" data-concept="latticeSites">原來的位置</button>就空了。<br>空位<button class="concept" data-concept="latticeRoute">繼續換邊</button>，<button class="concept" data-concept="latticeDopant">同一顆摻雜原子</button>就能<button class="concept" data-concept="latticeMigration">再次移動</button>。',alt:'以二維規則位置示意空位交換機制，不是矽的實際三維晶格幾何。灰色十字是固定位置，淺色 Si 圓是矽原子，黑色摻圓追蹤同一顆摻雜原子，虛線空圈 V 表示少了一個原子。先由摻雜原子填入相鄰空位，再由周圍矽原子接續補位；空位繞到摻雜原子另一側後，讓它再次換位。六次交換中只有兩次移動了這顆摻雜原子。下方可播放、回看或逐次前進。這是選定的示範順序，實際移動可往回，沒有設定真實時間或尺寸。'},
{title:'加入原子與電性活化',html:'<button class="concept" data-concept="activationTotal">加入的原子</button>，<button class="concept" data-concept="activationInactive">不一定每顆</button>都能<button class="concept" data-concept="activationActive">幫忙導電</button>。<br>本例<button class="concept" data-concept="activationFraction">有效的部分</button>越多，<button class="concept" data-concept="activationElectrons">可移動的電子</button><button class="concept" data-concept="activationRelation">越多</button>。',alt:'固定加入八個等權重的代表磷原子，左欄分類顯示已活化與未活化部分；已活化部分用深色 P⁺ 圈表示，未活化部分用淺色 P 圈表示。右欄顯示可移動電子的負號小點，下面三條同刻度橫條分別計數已加入、已活化與可移動電子。拉桿改變活化結果而不改變加入總數。另假設已活化部分充分電離、沒有相反型補償，略去本徵載子，所以電子數等於已活化數。兩欄是同一材料的分類圖，不是晶格位置或上下分層；電子動畫不代表退火或淨電流。'},
{title:'固溶度與高濃度限制',html:'<button class="concept" data-concept="solubilityConditions">固定條件下</button>，能<button class="concept" data-concept="solubilityDissolved">穩定分散的原子</button><button class="concept" data-concept="solubilityLimit">有上限</button>。<br><button class="concept" data-concept="solubilityTotal">繼續加入</button>，<button class="concept" data-concept="solubilityExcess">多出的部分</button>可能<button class="concept" data-concept="solubilityAggregate">聚在一起</button>。',alt:'固定材料、溫度與體積，以理想平衡分配說明固溶度。每個點代表等量摻雜原子，加入總量可從零調到二十四份；教學設定最多十二份穩定分散，超過部分以灰色聚集點表示。曲線橫軸為加入總量，縱軸為分散部分，刻度同為零到二十四；黑線先增加再停在十二，灰色對角虛線代表全部都分散的比較基準，垂直差距是聚集部分。分散加聚集等於總量，原子沒有消失。十二不是實際材料數值，圖中不是晶格結構；此單元沒有把固溶度等同於電性活化上限。'},
{title:'深度與側向擴散的取捨',html:'本例<button class="concept" data-concept="tradeTime">加熱更久</button>，<button class="concept" data-concept="tradeBoundary">分界</button><button class="concept" data-concept="tradeDepth">往下</button>，也<button class="concept" data-concept="tradeSide">往旁邊展開</button>。<br>想達到<button class="concept" data-concept="tradeTarget">目標深度</button>，也要顧到<button class="concept" data-concept="tradeLimit">側向範圍</button>。',alt:'固定開口與溫度、來源停止後的二維再分布。灰色區域表示新增有效施體濃度大於背景受體；實線為兩者相等的分界。中心垂直標尺量接面深度，表面右側標尺從開口邊緣量側向伸展。時間增加時，本例兩個長度都增加；設計參考為深度至少 0.80、每側超出開口不多於 0.60。拖動時間可比較深度未足、兩者都滿足、側向超出的狀態。參考線不阻擋擴散，實線外仍有原子；所有數字是未校準的相對值。'}
];

function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function normal(){return Math.sqrt(-2*Math.log(Math.max(1e-9,rand())))*Math.cos(2*Math.PI*rand())}
function reflect(v){v=((v%2)+2)%2;return v>1?2-v:v}
function generate(){for(let i=0;i<N;i++){positions[i*2]=rand();positions[i*2+1]=.008+rand()*.045}for(let s=1;s<=STEPS;s++){let o=s*N*2,p=o-N*2;for(let i=0;i<N;i++){positions[o+i*2]=reflect(positions[p+i*2]+normal()*.0044);positions[o+i*2+1]=reflect(positions[p+i*2+1]+normal()*.0085)}}}

二維 Fick 方程的可分離熱核解，並非引用來源中的一維公式直接當二維使用。D 在兩方向相同，圖上的兩方向也採相同長度比例。固定均勻有效受體背景 N_A=0.12，假設新增施體始終有效，實線為 C=N_A；沒有模擬高濃度聚集、活化變化、電場、載子或耗盡區。灰色填色僅標示 C>N_A，不按濃度深淺上色，也不代表原子被邊界包住，實線外仍有高斯尾端。深度 xⱼ 在 x=0 測量；側向 L_lat 為表面交點 x_surface 減 a。這兩個長度不是同一擴散尺度或最遠原子，不設定固定比例。設計目標深度 0.80、每側容許伸展 0.60 都是任意教學值；參考虛線不參與擴散方程，也不代表相鄰元件或實際短路判準。本頁所選時間範圍內兩者隨時間增加；固定總量若繼續擴散到峰值低於背景，接面可能消失，不能將此單調趨勢外推到任意久。所有長度、時間、濃度及 D 均為相對值，未指定元素或實際製程；沒有氧化、偏析、缺陷或實際遮罩阻擋率模型。播放只向前到終點後停下，重新播放與拉回時間都是回看結果，不代表物理擴散逆轉。':scene===22?'固定體積的理想平衡分配示意，獨立於第 22 單元。固定母體、摻雜物種類與溫度，假設已達平衡；總量 N=0–24 份，每點代表同樣份量的摻雜原子。為教學任意設定固溶量上限 S=12，分散量 min(N,S)，聚集量 max(0,N−S)，兩者加總為 N。固定體積使相對份量與相對濃度成正比；不是劑量、實際原子數、摻雜比例或 cm⁻³ 的預測。用一條硬上限說明最簡化的析出平衡近似，不是由實測材料資料擬合。聚集灰點仍在同一體積內，沒有刪除或排出。圖中點位只是可辨識的狀態排版，沒有繪出實際晶格、原子鍵結、團簇化學計量、成核或顆粒尺寸；省略母體原子及析出造成的體積變化。黑點代表溶入母體，不直接代表已活化施體或電子數；固溶度與電性活化上限是不同量。本圖沒有計算活化、電離、補償、載子濃度或導電率。真實固溶度隨母體、摻雜種類與溫度改變，非平衡處理可暫時保留超飽和狀態；高濃度團簇、析出、缺陷反應與熱歷程需另建模型，不能一律以本頁 min 函數取代。滑桿只比較不同總量的結果，不表示原子可立即可逆地聚集或溶解；沒有求解擴散、反應速率、退火或冷卻。圖中兩軸相同刻度 0–24；對角虛線是全部分散的比較線，黑線是本例分散部分，兩點的垂直差距為超出部分。':scene===21?'電性活化的狀態比較計數圖：獨立於第 21 單元，不承接其原子或空位軌跡。固定材料體積與已加入的 8 個等權重代表磷原子，κ=0–8 為拉桿指定的已活化數，未活化數為 8−κ，活化比例 η=κ/8；不是由溫度或時間求得的退火反應模型。左欄槽位只整理狀態，不是實際晶格位置、缺陷、團簇結構或摻雜原子的空間分布。已活化與電離分開：本頁另外採用充分電離假設，並假設沒有相反型摻雜補償、陷阱捕獲或其他電荷，省略本徵電子與電洞。每個有效磷施體已提供一個可移動電子，成為固定正離子；所以正離子數和本頁顯示的電子數都為 κ，正負電荷相抵，材料並未因此帶淨正電。灰圈代表未計入有效施體的中性記帳類別，不指定真實缺陷的電荷狀態。實際電子濃度不能普遍視為加入總濃度或活化濃度，還受電離、補償、溫度、陷阱等影響；κ=0 時顯示零個摻雜電子，只是省略本徵載子的教學模型，不表示真實矽沒有載子。兩欄是同一材料的分類圖，並非左右分離的實體層；電子小點是載子移動圖記，不是電子的實測軌跡、原子軌道或經典粒子軌跡。未施加電場或電壓，移動不表示有平均淨電流；沒有計算遷移率、電流、電阻或導電率。左欄原子不隨播放移動，播放也不會增加活化數，動畫循環只讓電子標記持續移動。改拉桿是切換指定的活化結果，不代表逐顆原子瞬間可逆地活化或退活化。合適退火可修復損傷、影響摻雜物的有效狀態，但本頁未求解退火、擴散、結構重排或高濃度限制。所有符號為代表性相對計數，沒有真實濃度、時間、尺寸或摻雜比例校準。':scene===20?'空位交換的原子位置示意：獨立於第 20 單元的濃度模型，不接續硼或砷的軌跡。以 5×5 共 25 個規則位置組成抽象二維鄰接圖；並非矽的三維鑽石晶格、晶面投影、鍵結圖或實際配位數。23 個矽原子、1 個未指定物種的摻雜原子、1 個原子空位，全程原子身分及總數固定，沒有邊界穿越、產生或消滅。每次只有一個原子從相鄰位置補進空位，原位置成為新的空位。動畫在兩端淡出淡入空位標記，是補位過渡的圖形提示，不表示形成第二個空位或空位是一顆穿行的粒子。六次交換採事先選定的示範順序，其中第一與第六次由同一顆摻雜原子補位，其餘由矽原子補位；空位繞到另一側後，摻雜原子累計換位兩次。虛線空位路徑記錄已空出的位置，數字是順序；摻雜原子起點圈與短線記錄其換位，不是擴散尺度、接面或整體濃度分布。此抽象圖沒有實作矽晶格中的真實鄰居層次或原子能量。選定方向是教學展示，真實熱跳遷有隨機性並可回跳；不能由這段選定路徑求擴散係數。空位機制只是可能的擴散方式之一，不能將本頁直接套為所有摻雜物的唯一機制。尺寸、圓圈大小、等待及跳動時間皆未校準；略去熱振動、缺陷生成消滅、電荷狀態與反應動力學。V 是缺少原子的點缺陷，與第 08 單元的電子電洞不同。':scene===19?'不同摻雜物的擴散比較：獨立的一維、定溫、固定劑量高斯再分布模型，不接續第 19 單元目前的分布。B 硼與 As 砷位於兩個獨立的半無限矽樣品，初始濃度分布、單位面積劑量與表面無新增／無流失邊界完全相同；不是共同摻雜模型，未模擬彼此交互作用、電場、載子或活化。溫度固定為 1000°C，即 1273.15 K。使用 G. Tuttle 的 EE432/532 教學資料第 23 張投影片所列近似 Arrhenius 參數：B 的 D₀=1.0 cm²/s、Eₐ=3.50 eV；As 的 D₀=9.17 cm²/s、Eₐ=3.99 eV。D=D₀ exp[−Eₐ/(kBT)]，kB=8.617333262×10⁻⁵ eV/K，T 用絕對溫度。得到 D_B≈1.39705×10⁻¹⁴、D_As≈1.47201×10⁻¹⁵ cm²/s，比值約 9.49；短條按 D_B=1 歸一，砷約 0.105，顯示時捨入為 0.11。參考資料也明確指出參數非常近似；本頁採用 D 不依位置、濃度或時間變化的簡化模型，沒有假設這個速度比適用所有溫度、濃度、晶格缺陷或製程。實際高濃度、缺陷歷史及其他擴散機制會改變有效 D，不能單憑原子大小或 N/P 型推斷速度。加熱時間 t=60 min×進程比例，內部換成秒計算；D 從 cm²/s 乘 10⁸ 轉為 μm²/s。共同初始尺度 ℓ₀=0.020 μm，S₀=ℓ₀²/4。各側 S=S₀+Dt，ℓ=2√S，C(z,t)/C₀=(ℓ₀/ℓ) exp[−z²/ℓ²]；C₀ 是共同的起始表面濃度，不是各側當下表面值。初始與後續的全深度相對曲線面積都等於 √πℓ₀/2，對應相同、固定的劑量。未設定實際劑量或絕對濃度，因此此圖不提供真實 cm⁻³ 製程預測。濃度橫軸 0–1、深度縱軸 0–0.50 μm，兩側刻度全程固定；深處尾端未截成實體邊界，畫面外解析尾端仍存在。灰虛線為共同起點；深色線是平均濃度的時間演化，不是單顆原子的路徑。尺標定義為 C(ℓ,t)/C(0,t)=1/e≈36.79%，不是最深原子、接面、硬邊界或 RMS 位移；有限起始寬度使完整尺度比不等於 √(D_B/D_As)，需保留 ℓ₀² 項。圓形元素徽記只識別物種，不按原子大小繪製。此單元比較所選近似模型下的物種差異，未求解預沉積來源化學、氧化、晶格缺陷演化或表面偏析。':scene===18?'熱預算的擴散模型：本頁獨立比較兩段固定溫度的保溫，不接續第 18 單元目前的分布。相同材料、相同摻雜物、相同有限寬度起始高斯分布，表面無新增或流失、半無限深度；劑量 Q=1 固定。左側 D=1、設定時長 4；右側 D=4、時長可調 0.50–2.00。D 的四倍是教學設定，並非溫度四倍，也不是某種摻雜物的實測資料；未指定真實溫度。一般 D(T)=D₀ exp[−Eₐ/(kBT)]，T 必須為絕對溫度；本頁不以 T×t 當作擴散熱預算。上圖橫軸為相對時間 0–4，縱軸為相對 D 0–4，兩側刻度相同；虛線矩形為設定保溫段，填色面積為已經過的 Θ=D×保溫時間。一般變溫歷程 Θ=∫D[T(t)]dt，分段恆溫則 ΣDᵢΔtᵢ。Θ 的物理維度是長度平方，不是熱能，也不同於單位面積的原子劑量 Q。兩段各自從時間零開始；左側已保溫 min(τ,4)，右側 min(τ,設定時長)，τ=4×進程比例。短段結束後保留其當時結果，用來和長段後續或結束時的結果比較；這是結果保留，不表示實際停止加熱後 D 立即為零。升溫、降溫及段後停留未模擬，真實歷程評估須將這些時段的 D(T) 一起積分。共同起始展寬參數 S₀=0.10，本頁新增 Θ 後 C(z)=Q/√[π(S₀+Θ)] exp[−z²/(4(S₀+Θ))]，z≥0；全深度積分為 Q，起點不奇異。下圖濃度軸 0–1.8，深度軸 0–12，灰虛線為共同起點；視窗底沒有實體邊界，曲線尾端繼續延伸。尺度 ℓ=2√(S₀+Θ)，定義為濃度剩各自表面值 1/e 的深度，並非最深原子、接面或 RMS 位移。新增熱預算相同時，因同一 S₀ 與邊界條件，所以整個解析分布相同；不能忽略初始寬度而把新增 Θ 的比例直接當作完整尺度平方比。本頁假設 D 僅隨空間均勻的溫度變化，不依位置或濃度變化，且沒有反應、漂移、活化變化或缺陷歷史效應；超出此模型時，相同熱預算不保證所有製程結果相同。所有數值為相對值，未校準真實製程。':scene===17?'擴散尺度與平方根：獨立的一維半無限矽、固定劑量高斯解析模型，不接續第 17 單元三層離散分布。起點理想化為表面 z=0 的無限薄摻雜層；表面無流失、沒有後續供應，深處濃度趨近零。相對劑量 Q=1，D=0.25 固定，C(z,t)=Q/√(πDt) exp[−z²/(4Dt)]，z≥0。全深度積分始終為 Q，但畫面只展示 z=0–6 的視窗；圖底沒有反射壁，尾端繼續延伸，不以可見面積當作完整劑量。兩圖濃度軸皆為 0–1.2、深度軸皆為 0–6，沒有自動縮放。左側時間 t₁=1，右側 t₂=1–9，全部由同一理想薄層起點計時；不是在既有有限寬度的預沉積剖面上，額外加熱時間的直接比例。為避免 t=0 的奇異分布，畫面從 t₁ 開始。選定 C(ℓ,t)/C(0,t)=1/e≈36.79%，所以 ℓ=2√(Dt)，左側 ℓ₁=1、右側 ℓ₂=√t₂，距離比恰為時間比的平方根。ℓ 是本頁明確選定的展開尺度，不是硬邊界、最深原子、接面深度或一維均方根位移 √(2Dt)；不同長度定義的係數可不同。灰色區與曲線是連續平均濃度圖，不是單顆原子的軌跡，標記沿曲線變化也不是原子移動路徑。圖中約 37% 是各自表面值的相同比例，不是固定的絕對濃度門檻。播放會連續增加右側的比較時間，拉桿可暫停並回看；左側保留為時間參考。時間、尺寸、濃度與 D 為相對值，未校準真實製程；假設 D 不隨位置、濃度或時間變化，未含漂移、反應及高濃度效應。':scene===16?'一層的流入與流出：三個等厚、等面積的有限體積擴散模型，面積 A、各層厚度 h、擴散係數 D 的相對值皆設為 1，外端通量為零，沒有內部生成或消耗。每個比較情境的初始總量都為 3，並在整個演化中保持不變；這是三層離散空間模型的解析時間解，不是連續空間擴散方程的精確解，也不接續第 16 單元的圖記。模型相對時間 τ=1.5×進程比例，不是實際製程秒數。中層初始濃度 m 為 0.70、1.00 或 1.30；上層起初 (3−m)/2+0.50，下層 (3−m)/2−0.50，選擇比較情境會同時重設三層初始分布與進程。令 a=0.50 exp(−τ)、b=(1−m)/2 exp(−3τ)，三層濃度依序為 1+a+b、1−2b、1−a+b。向下為正，Jᵢₙ=C上−C中，Jₒᵤₜ=C中−C下，三種情境的兩個通量都非負；中層 dC/dτ=Jᵢₙ−Jₒᵤₜ。實際一般式為 dC/dt=(Jᵢₙ−Jₒᵤₜ)/h；原子數變化率則為 dN/dt=A(Jᵢₙ−Jₒᵤₜ)。上、下兩層分別失去流入中層的量與接收由中層流出的量。圖中的短箭頭表示兩個邊界的淨通量，不代表單顆原子只能向下移動；移動標記依累積通量安排相位，點的疏密表示各層平均濃度，不是實測或逐顆追蹤的原子。右圖固定濃度軸 0–2；虛線是後續濃度曲線、實線是已經歷的部分，水平細虛線為中層起初濃度。各層數值、箭頭、曲線與累積檢查共用同一模型。流入與流出顯示平均相對速率，不是累計穿越點數；顯示數字經四捨五入，差值使用未捨入值計算。未校準實際溫度、尺寸、濃度或通量，未考慮漂移、反應及濃度相依擴散係數。':scene===15?'濃度坡度與通量：比較同一材料與溫度、相同中心距離下的平均擴散通量。本頁不接續第 15 單元的原子路徑。深度向下為正，範圍 z=0 到 1；兩個等厚層的中心在 0.25 與 0.75，Δz=0.50。拉桿設定 δ=C上−C下，範圍 −0.80 到 +0.80；線性濃度 C(z)=1+δ(1−2z)，所以 C上=1+δ/2、C下=1−δ/2，dC/dz=−2δ。相對擴散係數 D=1，依菲克第一定律，向下為正的淨通量 J=−D dC/dz=2δ。兩向平均交換採用兩層離散模型：向下量 D C上/Δz、向上量 D C下/Δz，相減恰好等於 J；這種雙向拆分依所選粗粒化模型而定，不是實測微觀單向通量，也不是累計穿越次數。小箭頭上的移動標記表示這兩個平均交換量的相對頻率；大箭頭方向表示淨量正負，長度與淨通量絕對值成比例。520 個靜態點是由同一線性濃度取樣的疏密圖記，不是逐顆原子或載子軌跡；改拉桿是在比較不同濃度剖面，不是實際時間演化。動畫只用來觀察這一刻的平均交換，沒有積分推進濃度場；若要長時間保持非均勻分布，需要邊界持續維持濃度。假設只有單純擴散、擴散係數不隨位置或濃度變化，略去漂移、反應等效應。深度、濃度、時間與通量皆為相對值，沒有真實製程校準。':scene===14?'曲線面積與劑量：本頁從第 10 單元的固定來源移除起點，取同一批 1,100 個代表原子，使用同一組驅入路徑；展開程度只用來回看這組分布，不是新的物理量或實際製程時間，也不接續第 14 單元的 440 個點。矽柱固定表面積 A、深度 L，邊界反射、不新增也不流失。將整個深度分為十個等厚層，逐點計數 nᵢ；各層平均濃度 Cᵢ = nᵢ/(A Δz)，劑量 Q = Σ Cᵢ Δz = N/A。圖上深度以 L 歸一，濃度以 N/(AL) 歸一，因此每層相對濃度為 10 nᵢ/N、相對層厚 0.10、相對劑量為 1；實際常用濃度 cm⁻³、深度 cm、劑量 cm⁻²。本圖的數字沒有校準為真實尺寸或製程濃度。右圖兩軸均為線性、尺度固定，填色矩形面積由每層平均濃度計算，階梯線不是平滑解析解；所有點及各層都納入加總，沒有裁掉尾端。有限點數使個別層的點數有波動；預期整體展開，並不要求每一層濃度都單調下降。圖中沒有背景摻雜或接面判定。':scene===13?'擴散主流程整合模型：由已有二氧化矽遮罩的矽開始，合併呈現形成開口、預沉積、移除來源、驅入四步；不是完整晶片製造流程。開口占圖中表面寬度 40%，不接續其他單元目前停留的狀態。預沉積直接沿用第 11、12 單元相同開口寬度下的 440 個代表原子及路徑，淨加入量按時間平方根安排；動畫的外部點與表面薄層僅示意來源，不模擬氣體反應或離子束。移除來源包含外部供應與表面可繼續提供摻雜物的殘留層；清除步驟中暫停矽內擴散並假設原子不流失。驅入從預沉積結束的每一個點位逐一接續，總量始終 440 個，邊界反射且無流失，允許側向擴散。場氧化層的變化、表面新氧化層與各種化學清洗細節略去，遮罩保持示意形狀。四步佔用的播放時間是教學安排，不代表真實製程時長比例；時間、濃度、尺寸未作製程校準。驅入強調時的平均深度線表示整體分布平均值，不是接面深度。本頁沒有背景摻雜或接面濃度求解，不能用最深的點判定接面。':scene===12?'一維平面接面的濃度模型：假設均勻、固定的 P 型背景受體濃度 N_A，新增 N 型施體由固定表面濃度供應。新增分布 N_D(z)=erfc[z/(2√Δ)]，表面濃度歸一為 1；Δ=0.004+0.065×本頁相對進程，表示固定溫度下由一個已有淺層分布的狀態繼續擴散，不是從未摻雜的矽開始，也不是接續第 12 單元的二維分布。以 N_D=N_A 求冶金接面；上方 N_D>N_A 為 N 型，下方為 P 型，假設摻雜已充分活化且電離。曲線、交點、接面線與深度讀值共用同一解析模型。點的疏密僅為該濃度的代表圖記，並非逐顆原子的隨機運動或載子位置；改變背景拉桿代表比較不同起始材料，保持本頁進程與新增分布。深度 0–1 是圖示的觀察尺度，濃度相對於新增表面值 1，沒有實際單位校準。冶金接面不是耗盡區邊界或實體障壁；沒有用最深原子或平均深度判定接面，電場、載子與耗盡區寬度未在本頁模擬。':scene===11?'側向擴散概念模型：沿用第 11 單元相同的隨機路徑與供應規則；同一開口寬度和相同進程時，兩頁的點位完全相同。本頁有獨立的進程與開口寬度，並非接續第 11 單元結束後的新製程步驟。假設遮罩足以阻擋外部直接穿透；所有新增點均由開口表面進入，之後可在連續的矽內向左右與深度方向隨機移動。虛線僅投影開口邊緣，不是障壁，也不是接面。深色點與點數表示當下位於開口投影之外、遮罩下方的原子，不是累計穿越次數，可能隨機增減。向兩側強調的兩條線來自本模擬的代表性原子，並非真實原子實測軌跡；方向箭頭只表示展開方向，單顆原子仍可往回移動。未由最遠的點定義擴散邊界或接面深度；未校準尺寸、時間、濃度，也未用螢幕方向長度比較擴散係數。加入量沿用示意的開口寬度乘時間平方根，不是精確二維濃度解。':scene===10?'選擇性擴散的概念模型：遮罩代表事先經圖案化與蝕刻開口的二氧化矽層，不是光阻或曝光用光罩。假設選用適合的摻雜物，且遮罩厚度足以在本次溫度與時間下阻擋原子從外部穿透。實際阻擋能力取決於材料、厚度、溫度與時間，不是對所有原子永遠不透。動畫只示意入口位置，外部點與連接路徑不代表離子束或實際氣體反應；不模擬氧化層內的慢速擴散。原子於開口表面加入後，在整塊矽內隨機移動，可以由內部側向移至遮罩下方；開口兩側沒有垂直障壁。加入量以開口寬度乘時間平方根安排，僅為視覺示意，未求解二維混合邊界濃度或邊緣通量。假設固定溫度，邊界不流失，時間及尺寸未校準；調整開口會重新開始一次局部預沉積，不接續第 10 單元。':scene===9?'有限劑量的驅入概念模型：起點直接取第 09 單元進程 100% 的全部 1,100 個點，不受第 09 單元目前停留進程影響。移除外部來源後，在固定溫度下繼續擴散；假設表面及外邊界不流失原子，原子總量與固定表面積下的劑量不變。表層取樣為圖中深度 0–10% 的固定體積；相對濃度＝當下取樣點數／起初取樣點數，1.00 代表本頁起點，並非第 09 單元的理想表面濃度設定。這是表面附近的平均濃度，不是零深度處的精確濃度；點數會有抽樣波動。平均深度線是整體分布的平均值，不是接面深度。時間、尺寸 // Approximate Arrhenius data: G. Tuttle, EE432/532, diffusion slide 23.
// Separate half-space samples; equal initial width and dose, no dopant supply/loss.

const TRADE_D=.10,TRADE_S0=.0025,TRADE_HALF=.5,TRADE_BG=.12,TRADE_DEPTH_GOAL=.80,TRADE_SIDE_MAX=.60;
function tradeErf(x){const sign=x<0?-1:1,v=Math.abs(x),u=1/(1+.3275911*v);return sign*(1-(((((1.061405429*u-1.453152027)*u)+1.421413741)*u-.284496736)*u+.254829592)*u*Math.exp(-v*v))}

function tradeData(elapsed=time){
 const t=Math.max(0,Math.min(1,elapsed/DURATION)),s=TRADE_S0+TRADE_D*t;
 const depthAt=x=>Math.sqrt(Math.max(0,4*s*Math.log(Math.max(1,tradeConcentration(x,0,s)/TRADE_BG))));
 let lo=0,hi=4;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(tradeConcentration(m,0,s)>TRADE_BG)lo=m;else hi=m}
 const xSurface=(lo+hi)/2,depth=depthAt(0),lateral=Math.max(0,xSurface-TRADE_HALF);
 return{t,s,depth,xSurface,lateral,depthReached:depth>=TRADE_DEPTH_GOAL,lateralOK:lateral<=TRADE_SIDE_MAX,depthAt};
}

}
