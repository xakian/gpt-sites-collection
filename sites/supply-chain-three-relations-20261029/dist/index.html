<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F9FA"><meta name="description" content="用 32 秒觀察同一委外封測案例中的實物、服務與資訊。"><title>供應鏈：區分物料、服務與資訊</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="styles.css"></head><body data-topic="supply-chain"><div id="observer"></div><template id="topic-notes"><label class="sr-only" for="station-select">選擇觀察步驟</label><select id="station-select" aria-label="選擇觀察步驟"></select><h2 id="observation-title">目前觀察</h2><p id="stage-caption"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">定位後保持暫停，可按上方播放接續。</p><p id="reset-note" class="source-intro"></p><details><summary>看這三件事與完整說明</summary>
    <p class="eyebrow">半導體・關係觀察 <span>01</span></p>
    <p class="source-intro">委外封測案例・非實際工期</p>
    <p class="overview-note">實物只在一處，資訊可以保留。<span>同一家公司，同時參與三種關係。</span></p>
    <div class="legend" aria-label="三種關係圖例">
      <span><i class="sample material"></i>實物：移交</span><span><i class="sample info"></i>資訊：傳送與保留</span><span><i class="sample service"></i>服務：誰替誰做</span>
    </div>
    <ol class="look-list"><li><strong>實物在哪裡？</strong>批次 A 只在一處，從晶圓代工廠到封測廠，再到系統廠。</li><li><strong>誰替誰做？</strong>封測廠替設計公司執行封裝與測試，工作在提供者廠內發生。</li><li><strong>傳遞哪些要求與結果？</strong>規格、報告、出貨指示是資訊，傳送後可在授權端點保留副本。</li></ol>
    <p>晶圓上有許多晶粒；封裝為晶粒提供連接與保護；測試依指定條件取得結果。</p>
    <details><summary>逐步觀察與定位</summary><div id="steps"></div></details>
    <details><summary>三題理解檢查</summary><details><summary>誰委託、誰執行、誰收到成品？</summary><p>設計公司委託，封測廠執行，指定系統廠收貨。這是本例安排，並非所有供應鏈都如此。</p></details><details><summary>委託資料與測試報告都是「服務」嗎？</summary><p>它們是資訊。受託執行封裝與測試是服務活動；資訊用來說明要求、記錄結果與協調交付。提供服務也可以同時交付加工後的實物。</p></details><details><summary>報告回設計公司，晶片也一定回去了嗎？</summary><p>沒有。報告傳送時晶片留在封測廠，之後依本例指示送到系統廠。資訊副本不等於另一批晶片。</p></details></details>
    <details><summary>文件內容與圖像意義</summary><p><strong>規格 A：</strong>本批封裝要求、測試要求與批次對應的概括；前置方案、設備、介面與工程已備妥，並非收到一張文件就能製造任何晶片。</p><p><strong>報告 A：</strong>A／本例條件符合。只示範可交付部分，不代表良率 100%。</p><p><strong>出貨指示 A：</strong>設計公司確認本例交付條件後，指定系統廠 C 收貨。</p><p>文件圖示代表電子資料內容。服務線沒有運送物件。圖示不代表件數；A 連結加工前後來源，不保證實際批號永不改變；動畫秒數不代表工期；實物箭頭不表示貨權。</p></details>
    <details><summary>案例範圍與限制</summary><p>這是一次指定的委外安排。先回報、確認後出貨是本例協調規則，不是全產業通則。真實資料、排程與物流也可並行；本片依序突出關係是教學安排。</p><p>本片合併示意一般矽基單晶粒 IC 的切割與封裝，再展示封裝後電性測試；前置晶圓測試與選片資料已備妥。其他材料供應、損耗、不良分流、重測與合約省略，不推論它們不存在。</p><p>三類是關係、活動與交付內容的分析角度，不是三種互斥公司。傳遞資料本身也可能是一種服務；這裡把資料內容稱為資訊，把受託工作稱為服務。</p><p>設計公司（Fabless semiconductor company）採無自有晶圓廠模式；封測廠（Outsourced Semiconductor Assembly and Test，OSAT）執行本例受託工作。四個抽象角色不代表真實公司的交易。</p></details>
    <details><summary>來源與支持主張</summary><p class="source-intro">依任務檔所附研究，查閱日期：2026-10-29。來源支持此分工可成立；四角色、時序與 32 秒動畫為教學設計。</p><ol class="sources"><li><a href="https://www.sec.gov/Archives/edgar/data/1047127/000104712726000014/amkr-20251231.htm" target="_blank" rel="noopener">Amkor Technology — 2025 Form 10-K</a><p>Item 1. Business／Overview：支持 Fabless 委外晶圓製造與封測，也有由代工廠統籌後段的安排；搜尋 Fabless semiconductor companies、drop shipment services。</p></li><li><a href="https://www.sec.gov/Archives/edgar/data/1122411/000119312526135585/d50802d20f.htm" target="_blank" rel="noopener">ASE Technology Holding — 2025 Form 20-F</a><p>Drop Shipment Services；Raw Materials and Suppliers／Packaging：支持從客戶或晶圓廠收晶圓、封裝有額外材料投入，以及直接送到指定收貨端。</p></li><li><a href="https://asekh.aseglobal.com/products-services/test.html" target="_blank" rel="noopener">ASE Kaohsiung — Test Service</a><p>Wafer probing／package final test、Test Engineering Capability：支持晶圓測試與封裝後測試為不同階段，測試生成量測與摘要資料。</p></li><li><a href="https://www.kyec.com.tw/en/Solution/testing-technology-support" target="_blank" rel="noopener">KYEC — Testing Technology Support</a><p>4. Test Data Management；5. Test Data and Yield Analysis：支持業者保留測試資料並傳給客戶。此處文件外觀與核准時點不是 KYEC 實際流程。</p></li></ol></details>
  </details></template><script type="module" src="app.js"></script></body></html>
