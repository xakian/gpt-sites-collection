<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="以可修訂的多維評分，探索半導體擴散及跨領域知識。"><title>知識座標圖</title><link rel="stylesheet" href="style.css?v=2"></head>
<body>
<main aria-label="知識座標探索"><div class="chartwrap" id="chartwrap"><svg id="chart" role="group" aria-label="知識座標圖，可拖曳平移與縮放"></svg><div id="emptyMap" class="emptymap" hidden>沒有符合條件的已評分單元<button data-act="clear" class="textbutton">清除篩選</button></div><div id="tooltip" class="point-tooltip" role="tooltip" hidden></div><div id="cluster" class="cluster" hidden></div></div></main>
<button class="menu-toggle" id="menuToggle" data-act="filters" aria-label="開啟選項側邊欄" aria-controls="sidebar" aria-expanded="false" title="選項"><svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
<aside class="sidebar" id="sidebar" aria-label="探索選項" inert>
 <div class="sidehead"><span>選項</span><button class="iconbutton" data-act="close-sidebar" aria-label="關閉選項側邊欄">×</button></div>
 <section class="side-section"><div class="section-label">座標軸</div><div class="axisfield"><label for="xaxis">X <span>橫軸</span></label><select id="xaxis"></select></div><div class="axisfield"><label for="yaxis">Y <span>縱軸</span></label><select id="yaxis"></select></div><div class="inline-actions"><button class="textbutton" data-act="swap">⇄ 交換座標軸</button><button class="textbutton" data-act="rules">評分表 ↗</button></div><p class="side-note">兩軸皆由 1 到 5，中心交會於 (3, 3)。</p></section>
 <section class="side-section"><label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="搜尋知識、公式、ID…" aria-label="搜尋知識"></label><div class="filtertitle">領域 <button data-act="clear" class="textbutton">清除篩選</button></div><div id="domains" class="domainfilters"></div><div class="filtertitle">單元類型</div><div id="types" class="typefilters"></div><div id="legend" class="legend"></div></section>
 <section class="side-section"><button class="navitem" data-act="list"><span>所有知識單元</span><span id="totalCount">40</span></button><button class="navitem" data-act="pending"><span>待評分</span><span id="pendingCount">1</span></button><div class="inline-actions"><button class="button" data-act="new">＋ 新增單元</button><button class="button" data-act="backup">資料管理</button></div><button class="navitem" data-act="jump" data-id="KD-001"><span>半導體擴散製程</span><span>↗</span></button></section>
 <section class="side-section"><label class="checkrow"><input type="checkbox" id="showEdges" checked> 選取時顯示連結</label><div class="viewcontrols"><button data-act="zoom-out" aria-label="縮小">−</button><button data-act="reset">重設視角</button><button data-act="zoom-in" aria-label="放大">＋</button></div><p id="visibleCount" class="side-note"></p><p class="side-note">滑鼠移到點上查看提示，點選展開內容。拖曳平移，滾輪或雙指縮放。</p><p class="side-note">位置相近只表示目前兩軸評分相近。分數可以修訂，不代表知識價值。</p><button class="textbutton" data-act="help">操作說明 ↗</button></section>
 <footer class="sidefooter"><span id="saved" class="saved">● 本機已儲存</span><p id="storageFoot"></p><div class="dataset-meta"><span><b id="statNodes">40</b> 單元</span><span><b id="statRels">62</b> 關係</span><span><b id="statDomains">0</b> 領域</span></div><button data-act="pending" id="pendingLink" class="textbutton"></button></footer>
</aside>
<aside id="detail" class="detail" aria-label="知識單元詳情" hidden></aside>
<dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script><script src="core.js"></script><script src="app.js?v=2"></script>
</body></html>
