<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>矽光子光纖主動對準</title><meta name="description" content="觀察量測光功率如何引導光纖對準與UV固定。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">局部斜俯剖視 · 34秒</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>量測、光場與固定關係</summary><p>淺藍模場可超出纖芯；晶片端的窄漸變尖端與較大的入口模場是不同形狀。淡紫虛線表示未收光的損失去向。晶片右端接收器固定，灰線是量測連線；下方虛線僅為回饋資訊。</p><p>後方固定膠接住光纖與支座，前端工作間隙不填膠。UV初期仍可調時補償，之後維持位置至完全固化，再鬆夾重測。此件維持較佳耦合不代表產品一律無偏移。</p></details><details><summary>簡化與來源</summary><p>單透鏡光纖對邊緣逆向漸變耦合器；只展開一軸位置搜尋，其他自由度假設已粗對準。短條是相對示意，不是實測百分比或通用效率。位移、模場、膠與時間均放大；未收光統稱散射、反射等損失，沒有能量憑空增加。</p><p>不展開雷射製造、調變、編碼、CPO或完整接收電路。選用代表性UV流程，膠配方、劑量與可調時間須依實際工法決定；不保證零收縮。</p><ul><li><a href="https://www.ficontec.com/wp-content/uploads/pdf/en/ASSEMBLYLINE-1906-web.pdf" target="_blank" rel="noreferrer">ficonTEC AssemblyLine：閉迴路對準、點膠、UV與收縮控制</a></li><li><a href="https://www.imec-int.com/en/articles/interfacing-silicon-photonics-high-density-co-packaged-optics" target="_blank" rel="noreferrer">imec：透鏡光纖、漸變邊緣耦合器與工作間隙</a></li></ul><p class="source-intro">2026-10-31查閱；共用規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
