<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="追蹤同一顆晶粒：翻轉、對位、迴焊，再看毛細底填膠沿間隙前進。可暫停、定位的繁體中文科學觀察動畫。"><title>倒裝接合——晶粒翻過來，怎麼接到基板？</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head>

<p class="eyebrow">FLIP CHIP · 倒裝接合</p><label for="step-select" class="sr-only">選擇步驟說明</label><select id="step-select"></select><h2 id="step-heading"></h2><h3>正在看什麼</h3><p id="step-watch"></p><h3>值得注意的細節</h3><p id="step-detail"></p><div class="keyframe"><button class="primary" id="seek-step">定位此步</button><span class="sources-note" id="key-time"></span></div><p class="pause-note">切換說明不會移動動畫。「定位此步」會收合面板並停格；「播放接續」從目前畫面繼續。</p>
<details><summary>補充俯視：膠怎麼繞過焊點？</summary>
<svg class="panel-figure" role="img" aria-label="移去晶粒後俯看間隙，底填膠從左側分流繞過焊點，右側為尚未填入的空隙" viewBox="0 0 340 222"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#4E8B78"/></marker></defs><rect x="20" y="44" width="300" height="136" rx="4" fill="#FAFCFC" stroke="#AEBFC5"/><path d="M20 44H195Q228 110 195 180H20Z" fill="#B5D8CB"/><g fill="#BCC7D0" stroke="#617888"><circle cx="95" cy="91" r="20"/><circle cx="177" cy="91" r="20"/><circle cx="259" cy="91" r="20"/><circle cx="95" cy="145" r="20"/><circle cx="177" cy="145" r="20"/><circle cx="259" cy="145" r="20"/></g><g fill="none" stroke="#4E8B78" stroke-width="1.7" marker-end="url(#arrow)"><path d="M32 85Q56 85 66 65T118 65Q136 65 140 80"/><path d="M32 97Q53 97 68 113T120 114Q133 114 142 102"/></g><g fill="#253039" font-size="13"><text x="20" y="27">從邊緣供膠</text><text x="231" y="27">尚未填入</text><text x="30" y="205">綠：底填膠</text><text x="179" y="205">灰：實心焊點</text></g></svg>
<p>這是移去晶粒後的俯視示意，讓你看見剖面以外的通道。液體沿焊點周圍分流，再在另一側匯合；主畫面剖面中的綠色不穿越灰色焊點。</p></details>
<details><summary>材料角色與本例路線</summary><p>本例從「已帶焊料凸塊的晶粒＋已完成線路的封裝基板」開始。凸塊先與晶粒接點相連，放置後經迴焊潤濕、冷卻形成焊點，再以毛細底填膠填滿間隙並固化。</p><p>採用與底填膠相容的超低殘留免清洗助焊路線。助焊施加壓縮為焊墊上的紫色薄層；迴焊後微量殘留縮淡保留，不演出清洗。實際材料組合仍需驗證相容性；水洗型助焊劑則有清洗與乾燥流程，並非本例。</p><p>焊點提供電性連接。環氧底填膠固化後提供保護與機械支撐，減輕晶粒與基板熱膨脹不同造成的焊點應變。沒有加入銅柱熱壓、非導電膠預塗或模封底填等其他路線。</p></details>
<details><summary>簡化、比例與限制</summary><ul><li>36 秒是觀看時間，不是製程時間。圖中沒有指定溫度、尺寸或流速，也不是定量物理模擬。</li><li>四個 A–D 接點代表一排接點；真實陣列更多，尺寸、間隙、焊墊與焊料輪廓均放大。編號與深色角標只用來追蹤身分。</li><li>固定側視投影呈現繞左右軸的半圈翻轉；厚度與深度均為示意，省略設備、吸嘴及取放細節。</li><li>焊料輪廓示意潤濕及塌陷，不解算體積守恆、表面張力、氧化層或金屬間化合物。晶粒小幅下降時，上下接觸連續。</li><li>底填膠前緣是理想化單側供膠，藉剖面顯露焊點。實際是三維繞流，可能因黏度、間隙與點膠圖樣困住空氣；此例未模擬空洞、填料粒子、翹曲、應力或缺陷。</li><li>綠色與細紋用來顯示液態／固化態，不代表材料真實顏色或透明度。未指定商用助焊劑與底填膠配對，來源產品只支持製程原理。</li><li>亮線只標示晶粒接點經焊點通往基板線路的一段連接，不模擬電子速度、不宣稱通過電性測試。省略後續封蓋、植球、測試等封裝流程。</li></ul></details>
