<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>封裝吸濕與迴焊爆米花效應</title><meta name="description" content="兩件塑膠封裝的吸濕、乾燥、共同加熱與可能損傷對照。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">固定剖視 · 36秒 · A／B對照</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不改動畫；定位後暫停。</p><details><summary>材料與水分符號</summary><p>灰藍為模封材料，深藍為晶粒，柔銅色為金屬墊與引腳，淡紫為黏著層。藍點代表水分，空心圓表示水氣壓力示意；它們都不是實際可見的大水滴或氣泡。</p><p>完整樹脂也能吸濕。受控乾燥可使水分向外移動；迴焊熱歷程下，熱膨脹不匹配與水氣壓可能推動界面分層及裂紋。A先分層再裂向外表，冷卻仍保留損傷。</p></details><details><summary>防潮袋、乾燥劑與濕度卡</summary><p>適當的防潮袋與乾燥劑可協助維持乾燥保存環境。濕度指示卡反映袋內環境的濕度情況，不能直接量出封裝內部含水量。</p><p>實際烘烤、載具相容性、開封後可用時間與迴焊條件須依器件供應商的適用指引。動畫不提供通用操作配方或MSL表。</p></details><details><summary>簡化與來源</summary><p>吸濕與乾燥時間被大幅壓縮；水分符號、分層間隙及裂紋都放大。採相同結構的兩件代表試件，省略完整電路、其他引腳與焊料細節；下方是轉運承托，迴焊只示意熱暴露，非完整板級組裝。</p><p>這是可能結果：並非受潮必裂，也非乾燥保證不失效。沒有含水擴散、熱傳或破壞力學求解。乾燥是預防，不能修補既有裂紋。原件帶著結果退出，新件才開始下一輪。</p><ul><li><a href="https://www.ti.com/lit/an/snoa300a/snoa300a.pdf" target="_blank" rel="noreferrer">TI：塑膠封裝吸濕致裂，頁2、4、5</a>（2006修訂，僅採基礎機制與包裝概念，不採舊操作數字）</li><li><a href="https://doi.org/10.1557/PROC-515-31" target="_blank" rel="noreferrer">Park、Yu：水分擴散與界面破壞的聯合分析</a>（1998，依可讀摘要確認熱載荷與水氣壓共同作用；全文未取得）</li></ul><p class="source-intro">2026-10-31查閱；共用規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
