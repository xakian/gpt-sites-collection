  <h2 id="note-title">對準同一個晶粒位置</h2>
  <p id="note-body">晶圓仍是一整片。工作台將選定晶粒的金屬接點對準探針；數位晶圓圖以相同座標記錄這個位置。</p>

  <h3>值得注意的細節</h3>
  <p id="note-detail">探針與接點必須先對準，再建立暫時電接觸。圖上的位置標記不是切割，也不是晶粒正在離開晶圓。</p>
  <p>俯視圖以晶圓為參考，所以晶圓保持固定；接觸放大圖顯示工作台的 XY 定位與 Z 升降。測完一個位置，先分離，再移向下一個位置。</p>

  <details>
    <summary>簡化與判讀限制</summary>
    <ul>
      <li>54 秒是觀看安排，不是真實測試時間。先慢看兩顆，再加快呈現其餘 35 顆；實務可同時測多顆，也可能重測。</li>
      <li>37 顆晶粒與 4 支探針都是示意。晶粒大小、接點、探針、接觸間隙與升降距離沒有按相同比例繪製；省略外殼、線路、溫控、校正與探針清潔。</li>
      <li>示例以「相對輸出」的 0.90–1.10 區間示範判讀；0.96 通過、1.28 未通過。這些無因次數值不是工業規格，也不代表任一真實晶片的測試限值。實際測試包含多項電性與功能檢查。</li>
      <li>本圖的 X 向右、Y 向下，中心為 (0,0)。這是晶粒索引，不是毫米；不同設備或檔案可採用不同原點與方向。</li>
      <li>晶圓圖是數位測試紀錄。✓／× 與結果色沒有塗到實物上；晶粒測完仍留在完整晶圓上。未測與未通過是不同狀態。</li>
      <li>通過只表示符合本次測試條件、項目與限值，不能保證所有功能與可靠度。未通過也可能需要排除接觸或量測異常；本版省略異常診斷、重測及多級分類。</li>
      <li>接觸力可使探針微量彈性變形，某些接觸形式會有微小擦拭；本圖不模擬接觸力、接觸電阻或氧化層破除。探針不應被理解為刺穿晶粒。</li>
      <li>電性路徑的亮起與讀值變化用來提示測試活動，不表示電子或資料以畫面速度沿線移動。循環遮罩表示「重新觀看同一示意」，不表示製程倒轉或實際刪除測試紀錄。</li>
    </ul>
  </details>
