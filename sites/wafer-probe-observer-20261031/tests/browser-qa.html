<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>晶圓探針測試 · 本機尺寸驗收</title><style>body{margin:0;background:#DDE3E7;font:13px system-ui}nav{height:45px;display:flex;align-items:center;gap:8px;padding:0 12px}button,select{height:36px;font:inherit}iframe{border:0;display:block;margin:0 auto;background:#F7F9FA}label{margin-left:12px}</style></head><body><nav aria-label="驗收視窗"><label for="size">畫面尺寸</label><select id="size"><option>1280×500</option><option>1024×768</option><option>390×844</option><option>360×560</option><option>844×390</option></select><button id="reload">重新載入動畫</button><label><input id="reduce" type="checkbox">軟體強制減少動態（非系統驗收）</label></nav><iframe title="動畫驗收視窗" width="1280" height="500" src="/?qa"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split('×');frame.width=w;frame.height=h;};document.querySelector('#reload').onclick=()=>frame.src='/?qa'+(document.querySelector('#reduce').checked?'&motion=reduce':'');document.querySelector('#reduce').onchange=()=>document.querySelector('#reload').click();</script></body></html>
