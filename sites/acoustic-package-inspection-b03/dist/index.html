<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="水耦合脈衝回波逐列掃描，在同一深度時間窗累積C掃描影像"><title>超音波封裝檢測</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 8 · 34 秒</p><h2>回波逐點累積，形成界面訊號圖</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>回波與時間窗</summary><svg viewBox="0 0 320 150" role="img" aria-label="正常與分層回波示意，選取相同時間窗" style="width:100%;height:auto"><rect x="190" y="10" width="44" height="110" fill="#dcebed"/><path d="M40 42h24l5 -18l5 30l5 -12h110l9 -9l9 18l9 -9h80M40 94h24l5 -18l5 30l5 -12h110l9 -28l9 50l9 -22h80" fill="none" stroke="#537F91" stroke-width="2"/><text x="6" y="42" font-size="12">參考</text><text x="6" y="94" font-size="12">分層</text><text x="160" y="141" text-anchor="middle" font-size="12">藍框：同一界面時間窗；橫向為回波時間</text></svg><p>只比較時間窗內的幅值，不把表面回波混入所選界面。波形為示意，沒有實測時間或振幅刻度。</p></details><details><summary>簡化與來源</summary><p>採水耦合脈衝回波C-SAM，聚焦並選取同一內部界面的時間窗。先用教學剖切指出一處既有分層，再恢復外觀；剖切不是檢測過程的物理切割。正常及分層兩個單點先示範回波，正式逐列掃描從14秒開始。</p><p>右側或下方C掃描只填入已接收時間窗回波的位置。蛇形掃描每個格點先發送、再接收，回波返回後才填格；深色表示本例所選時間窗內較大的回波幅值，淺色是正常參考。空白格代表未測，不代表正常。</p><p>含氣分層常造成強反射，但強或亮訊號也可能與材料界面、耦合及設定有關。本例與正常參考比較後圈出待判讀區，不把所有亮點判成缺陷。未模擬相位反轉，只用定性幅值編碼。</p><p>頻率、衰減與解析度互相制約；上方強反射可遮蔽深部，水耦合不良也影響訊號。圖是所選深度範圍的聲學訊號，並非透視照片；不保證能看穿任意材料。聲波放慢、缺陷與格點放大，不使用實測數值。</p><p>完成件帶原有分層離開；檢測沒有修補缺陷。結果卡表示本輪資料另存，下一輪清空量測區並使用新封裝編號。這是動畫中的資訊副本，重載網頁不保存實際檢測資料；沒有未要求的後端。</p><ul><li><a href="https://www.pvatepla.com/products-technologies/advanced-packaging-inspection/" target="_blank" rel="noreferrer">PVA TePla：脈衝回波、水耦合、逐列掃描與A/C-scan時間窗</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
