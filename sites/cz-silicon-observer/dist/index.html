<template id="topic-notes"><p class="eyebrow">CZ · CZOCHRALSKI · 主題 1.0.0</p><h2>一顆晶種，延續成整根晶棒</h2><p>晶種提供排列取向。界面移走凝固熱時，熔體中的矽在既有晶體下端接續結晶；拉升讓已形成的固體離開界面，下一段繼續長出。</p>
<label for="step-select" class="sr-only">選擇步驟說明</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選說明不會跳動畫；按「定位此步」才定位並暫停。</p>
<details><summary>單晶排列與兩種尺度</summary><svg class="panel-diagram" viewBox="0 0 320 175" role="img" aria-label="固液界面上方依相同方向排列，下方熔體尚未排定。僅表示取向，不是實際矽晶格。"><rect x="24" y="20" width="136" height="66" fill="#dce7ec"/><rect x="24" y="86" width="136" height="67" fill="#f0d8bf"/><path d="M24 86H160" stroke="#b66e42" stroke-width="3"/><g fill="#86a6b7"><circle cx="46" cy="38" r="5"/><circle cx="76" cy="38" r="5"/><circle cx="106" cy="38" r="5"/><circle cx="136" cy="38" r="5"/><circle cx="46" cy="67" r="5"/><circle cx="76" cy="67" r="5"/><circle cx="106" cy="67" r="5"/><circle cx="136" cy="67" r="5"/></g><g fill="#d8ab82"><circle cx="41" cy="105" r="5"/><circle cx="92" cy="113" r="5"/><circle cx="134" cy="100" r="5"/><circle cx="66" cy="137" r="5"/><circle cx="126" cy="139" r="5"/></g><g fill="#253039" font-size="15"><text x="179" y="51">固體：取向延續</text><text x="179" y="91">固液界面</text><text x="179" y="132">熔體：尚未排定</text></g></svg><p>規則圓點只表示取向延續，不是矽實際的鑽石立方晶格，也不是逐顆原子的真實軌跡。局部圖是另一個尺度，不是額外生成的第二根晶棒。</p><p>設備是肉眼可見的尺度，原子排列是原子尺度；兩者沒有共同縮尺。主圖橫向細線只是追蹤已形成固體的輔助線，不是晶界或分層。窄畫面將局部圖放在本面板。</p></details>
<details><summary>為何要同時控制溫度、拉速與旋轉？</summary><p>溫度梯度決定界面附近能否持續移走凝固熱；拉速與凝固生長須相互配合；晶棒與坩堝的旋轉影響熱與物質傳輸，以及界面形狀。它們一起影響直徑與晶體品質。</p><p>小圓點與弧箭頭表示晶棒旋轉，不代表晶體取向混亂。整塊晶體一起旋轉，內部的相對排列仍然延續。坩堝也可旋轉；本圖省略其驅動，只在說明交代。</p><p>這不是可調製程的模擬器。沒有把「某一拉速必然對應某一直徑」當成通用公式。</p></details>
<details><summary>晶棒之後如何成為晶圓？</summary><p>拉晶完成後，晶棒還要整徑、切片、研磨／研削、蝕刻、拋光、清洗與檢查。這些加工才讓晶棒成為平坦、潔淨的晶圓；拉出晶棒並不等於晶圓已完成。</p></details>
<details><summary>簡化、科學限制與來源</summary><ul><li>48 秒是觀看時間，真實熔化、穩溫、拉晶與冷卻需要更久；各階段使用不同時間壓縮。</li><li>固定剖視、形狀與顏色均為示意。細頸刻意加粗，晶棒縮短；界面畫成平面，忽略真實彎曲、液面彎月面細節與熱應力。</li><li>液面下降按旋轉體體積積分相應減少；採等效等密度與固定截面容器，不是工程質量、熱流或流體計算。原料熔化和液面外形也經簡化。</li><li>晶種接觸熔體時的局部回熔、雜質偏析、摻雜、氧、差排、磁場、氣氛流動、爐室、保溫、冷卻與承重裝置不做模擬。未涵蓋 MCZ、FZ 或連續補料。</li><li>換爐次以整組原料容器退出／進場交代，並非真實熱坩堝的搬運方式。</li></ul><p class="source-intro">一手資料，查閱日期 2026-10-31；以下為製造商原始資料的中文摘要。</p><ol><li><a href="https://www.sumcosi.com/english/products/process/" target="_blank" rel="noopener">SUMCO｜Production Processes</a>：石英坩堝、熔體、接種與取向延續，及晶圓後段加工。</li><li><a href="https://www.pvatepla.com/products-technologies/crystal-growth/czochralski-process/" target="_blank" rel="noopener">PVA TePla｜Czochralski Process</a>：界面結晶、拉升、溫度梯度與晶棒／坩堝旋轉的共同控制。</li><li><a href="https://indico.cern.ch/event/423555/contributions/1039396/attachments/895229/1261198/CERN_RD-50_06_2005_Okmetic_OA.pdf" target="_blank" rel="noopener">Okmetic｜CERN RD50 製造簡報（2005）</a>：接種、細頸、肩部、主體與錐形收尾順序。</li><li><a href="https://www.sas-globalwafers.co.jp/eng/technical/manufacturing.html" target="_blank" rel="noopener">GlobalWafers Japan｜Production Processes</a>：熱場／拉速、石英坩堝與後續晶圓加工。</li><li><a href="https://patents.google.com/patent/US7628854B2/en" target="_blank" rel="noopener">SUMCO｜US7628854B2 製造方法原始專利</a>：接種熱衝擊、細頸與差排排除的背景說明；不採用其特定工藝作為通用參數。</li></ol></details>
