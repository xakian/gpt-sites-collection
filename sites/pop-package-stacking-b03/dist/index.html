<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="完整上下封裝以周邊焊點接合，載具避開下層待裝板焊球"><title>PoP 封裝堆疊</title><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="materials.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">封裝觀察 5 · 30 秒</p><h2>兩個完整封裝，上下接成一組</h2><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h3>正在看什麼</h3><p id="step-what"></p><h3>值得注意的細節</h3><p id="step-detail"></p><button id="seek-step" class="primary">定位此步</button><p class="pause-note">選擇說明不改變畫面；定位後保持暫停。</p><details><summary>簡化與來源</summary><p>採傳統周邊PoP、two-pass路線。本輪僅示範載具內的第一次封裝間迴焊；整組之後才裝主板並經第二次迴焊。TI文件整體較推薦one-pass，本圖因觀察範圍而選two-pass，不代表製程優劣。</p><p>助焊採上層焊球受控沾助焊劑的示意，依TI第7.1節的接點準備機制；該節量產例是one-pass，本圖將機制接入two-pass教學模型，並非TI驗證過的專用配方。沾液槽在上方作業區進退，工具在放置後離開。</p><p>中央模封凸起低於上層基板，焊點只潤濕各自焊墊。下層底部球同樣受熱，以附著墊面與表面張力保持，載具支撐基板邊緣而不碰球；實際載具、翹曲與熱剖面需另行驗證。</p><p>上下封裝已完成，內部元件僅用輪廓識別，不展開打線或倒裝。綠色虛線是定性連通路徑，經基板橫向走線轉接，不是貫穿所有球的一根金屬柱。尺寸、球距與潤濕形變放大；不提供溫度配方。</p><ul><li><a href="https://www.ti.com/lit/an/spraba8/spraba8.pdf" target="_blank" rel="noreferrer">Texas Instruments SPRABA8：第5節two-pass與第7節接合準備</a></li></ul><p class="source-intro">2026-10-31查閱。規格v1.0／範本1.0.0／主題1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
