<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>銅柱凸塊製作</title><meta name="description" content="觀察銅柱、鎳阻障層、錫銀焊料帽與迴焊整形。"><link rel="stylesheet" href="shared/observer.css"><link rel="stylesheet" href="topic.css"></head><body><div id="observer"></div><template id="topic-notes"><p class="eyebrow">局部剖視 · 32 秒 · 示意比例</p><label for="step-select">選擇觀察步驟</label><select id="step-select"></select><h2>正在看什麼</h2><p id="watch"></p><h2>值得注意的細節</h2><p id="detail"></p><button class="primary" id="seek-step">定位此步</button><p class="pause-note">選擇說明不會跳動畫；按定位後暫停。</p><details><summary>完成態的層序</summary><svg viewBox="0 0 330 240" role="img" aria-label="焊料帽、鎳層、銅柱、凸塊下金屬及原焊墊"><rect x="70" y="200" width="190" height="20" fill="#D8E0E5"/><rect x="130" y="190" width="70" height="10" fill="#C7AB83"/><rect x="130" y="184" width="70" height="6" fill="#858895"/><rect x="130" y="90" width="70" height="94" fill="#C98E70"/><rect x="130" y="82" width="70" height="8" fill="#A6B2AA"/><path d="M130 82Q165 22 200 82Z" fill="#CBD6E0"/><text x="165" y="28" text-anchor="middle" font-size="16">焊料帽</text><text x="244" y="87" font-size="16">鎳</text><text x="244" y="143" font-size="16">銅</text><text x="245" y="191" font-size="14">UBM</text></svg><p>鈍化層保護焊墊周圍，底層金屬只在柱下保留。這是含鎳阻障的代表結構；沒有宣稱所有廠商都用相同層序。</p></details><details><summary>簡化與來源</summary><p>厚度、直徑、時間非實際比例；保留兩個相鄰接點。厚光阻曝光顯影、底層金屬沉積、助焊劑處理與清洗簡化。UBM 採相容複合金屬示意，不指定未查證的附著層配方或蝕刻液。</p><p>焊料平頂轉為圓頂時以軸對稱形狀保持示意體積；不是表面張力模擬。加熱過程不熔化銅柱。停在晶圓凸塊完成，沒有倒裝、接合或底填。</p><ul><li><a href="https://www.indium.com/blog/reflow-of-copper-pillar-microbumps/" target="_blank" rel="noreferrer">Indium：銅柱焊料帽的整形迴焊</a></li><li><a href="https://insulectro.com/wp-content/uploads/2022/03/Copper-pillar-electroplating-2.0.pdf" target="_blank" rel="noreferrer">Insulectro：銅種子、光阻與鎳阻障層</a></li></ul><p class="source-intro">查閱 2026-10-31。共用規格 v1.0／範本 1.0.0／主題 1.0.0。</p></details></template><script type="module" src="app.js"></script></body></html>
